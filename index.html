<style>
#ponte-login { position: fixed; inset: 0; z-index: 1000; background: #ffffff; display: grid; place-items: center; padding: 16px; font-family: "Manrope", "Segoe UI", system-ui, sans-serif; color: #121214; }
#ponte-login .pl-card { width: min(380px, 100%); display: grid; gap: 14px; }
#ponte-login .pl-marca { font-weight: 800; font-size: 15px; color: #5f9483; }
#ponte-login h1 { font-size: 24px; margin: 0; }
#ponte-login p { margin: 0; color: #76736c; line-height: 1.5; }
#ponte-login form { display: grid; gap: 10px; }
#ponte-login input { font: inherit; padding: 12px 14px; border: 1px solid #ececee; border-radius: 12px; background: #f4f4f5; }
#ponte-login button { font: inherit; font-weight: 700; padding: 12px 14px; border: 0; border-radius: 12px; background: #5f9483; color: #fff; cursor: pointer; }
#ponte-login button:disabled { opacity: .6; }
#ponte-login .pl-sec { background: #f4f4f5; color: #121214; }
#ponte-login .pl-msg { color: #c25d41; }
#ponte-login .pl-ok { color: #5f9483; }
#ponte-login label { display: grid; gap: 4px; font-size: 13px; font-weight: 600; color: #76736c; }
#ponte-login .pl-links { font-size: 14px; }
#ponte-login a, #ponte-acessos a { color: #5f9483; font-weight: 700; }
#ponte-barra { position: fixed; z-index: 900; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)); display: flex; gap: 6px; font-family: "Manrope", "Segoe UI", system-ui, sans-serif; }
#ponte-barra button { font: inherit; font-size: 13px; font-weight: 700; padding: 8px 12px; border: 1px solid #ececee; border-radius: 999px; background: #fff; color: #121214; cursor: pointer; box-shadow: 0 2px 10px rgba(0,0,0,.08); display: flex; align-items: center; gap: 6px; }
#ponte-barra span { background: #c25d41; color: #fff; border-radius: 999px; min-width: 18px; padding: 0 5px; font-size: 11px; line-height: 18px; text-align: center; }
#ponte-acessos { position: fixed; inset: 0; z-index: 1000; background: rgba(18,18,20,.35); display: grid; place-items: center; padding: 16px; font-family: "Manrope", "Segoe UI", system-ui, sans-serif; color: #121214; }
#ponte-acessos .pl-card { width: min(560px, 100%); max-height: calc(100vh - 32px); overflow: auto; background: #fff; border-radius: 16px; padding: 20px; display: grid; gap: 12px; }
#ponte-acessos .pl-topo { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
#ponte-acessos h1 { font-size: 22px; margin: 0; }
#ponte-acessos p { margin: 0; color: #76736c; line-height: 1.5; }
#ponte-acessos ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
#ponte-acessos li { border: 1px solid #ececee; border-radius: 12px; padding: 12px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; }
#ponte-acessos li small { color: #76736c; overflow-wrap: anywhere; }
#ponte-acessos .pl-bts { display: flex; gap: 6px; }
#ponte-acessos button { font: inherit; font-size: 13px; font-weight: 700; padding: 8px 12px; border: 0; border-radius: 10px; background: #5f9483; color: #fff; cursor: pointer; }
#ponte-acessos button.pl-sec { background: #f4f4f5; color: #121214; }
#ponte-acessos .pl-msg { color: #c25d41; }
#ponte-acessos .pl-st { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: #f4f4f5; color: #76736c; }
#ponte-acessos .pl-pendente { background: #f1dcc4; color: #8a5a1c; }
#ponte-acessos .pl-aprovado { background: #d7efe6; color: #3f6f60; }
</style>

<body>
<title>Painel do Consultório</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sempre branco, mesmo com o claude.ai no modo escuro; a seção escolhida fica verde (pedido do Pedro, 01/11/2026). */
:root, :root[data-theme="dark"] {
  color-scheme: light;
  --bg: #ffffff;
  --panel: #ffffff;
  --field: #f4f4f5;
  --fg: #121214;
  --muted: #76736c;
  --line: #ececee;
  --ink: #111113;
  --on-ink: #ffffff;
  --accent: #5f9483;
  --accent-soft: #d7efe6;
  --peach: #f1dcc4;
  --bad: #c25d41;
  --strong: #5f9483;
  --mid: #b98a3e;
  --weak: #8c8f97;
  --font-ui: "Manrope", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --radius: 14px;
}
html, body { height: 100%; background: #ffffff; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 15px; line-height: 1.5; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }

.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100%; }

/* barra lateral */
.side { background: var(--panel); color: var(--fg); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 24px;
  padding-block: 24px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: 18px;
  position: sticky; top: 0; height: 100vh; }
.brand { display: flex; flex-direction: column; gap: 2px; padding-inline: 8px; }
.brand b { font-size: 17px; font-weight: 800; letter-spacing: -0.01em; }
.brand span { font-size: 12px; opacity: .6; }
.nav { display: flex; flex-direction: column; gap: 2px; list-style: none; margin: 0; padding: 0; }
.nav button { width: 100%; display: flex; align-items: center; gap: 10px; text-align: left;
  border: 0; background: transparent; color: var(--fg); padding: 10px 10px; border-radius: 10px; opacity: .78;
  transition: background .15s ease, color .15s ease; }
.nav button:hover { opacity: 1; background: var(--field); }
.nav button[aria-current="page"] { opacity: 1; background: var(--accent); color: #fff; font-weight: 700; }
.nav .ic { width: 20px; height: 20px; flex: none; }
.nav .soon { margin-left: auto; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; opacity: .55; }
.side-foot { margin-top: auto; font-size: 12px; opacity: .55; padding-inline: 8px; }

/* área principal */
.main { min-width: 0; padding-block: 32px 48px; padding-left: max(16px, 4vw); padding-right: max(16px, env(safe-area-inset-right, 0px), 4vw); }
.page-head { display: flex; flex-direction: column; gap: 6px; margin-bottom: 24px; max-width: 70ch; }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.page-head h1 { font-size: clamp(24px, 3vw, 32px); font-weight: 800; letter-spacing: -0.02em; }
.page-head p { margin: 0; color: var(--muted); }

/* aba Agentes: uma faixa por nível (chefes, contratados, estagiários) e os cartões de cada um embaixo */
.tiers { display: flex; flex-direction: column; gap: 26px; }
.tier-band { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; padding: 10px 14px; margin-bottom: 12px;
  border-radius: 10px; background: var(--field); border-left: 4px solid var(--accent); }
.tier-band.chefe { border-left-color: var(--ink); }
.tier-band.estagiario { border-left-color: var(--mid); }
.tier-band h2 { font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
.tier-band .n { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.tier-band p { margin: 0; font-size: 13px; color: var(--muted); }
.members { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.member { display: flex; gap: 14px; align-items: flex-start; text-align: left; min-width: 0; border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--panel); padding: 16px; transition: transform .15s ease, box-shadow .15s ease; }
button.member:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(17,17,19,.08); }
.member > div { min-width: 0; }
.member h3 { font-size: 16px; font-weight: 800; }
.member .role-line { display: block; font-size: 13px; font-weight: 600; color: var(--muted); }
.member ul { margin: 8px 0 0; padding-left: 16px; font-size: 13px; color: var(--muted); }
.member .state { display: inline-block; margin-top: 10px; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; font-weight: 700;
  padding: 4px 10px; border-radius: 999px; background: var(--field); color: var(--muted); }
.member .state.on { background: var(--accent-soft); color: #3f6f60; }
.member.off { border-style: dashed; }
.member.off h3 { color: var(--muted); }
.member.off p { margin: 4px 0 0; font-size: 13px; color: var(--muted); }

/* rendimento da semana, embaixo do escritório */
.perf { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }
.perf-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
.perf-head h2 { font-size: 15px; font-weight: 800; }
.week-nav { display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.week-nav button { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); line-height: 1; }
.week-nav button:disabled { opacity: .35; cursor: default; }
.perf-row { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 16px; align-items: center; padding-top: 14px; border-top: 1px solid var(--line); }
.perf-who { display: flex; align-items: center; gap: 12px; min-width: 0; }
.perf-who b { display: block; font-weight: 800; }
.perf-who span { display: block; font-size: 12px; color: var(--muted); }
.bars { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.bar-line { display: grid; grid-template-columns: 116px minmax(0, 1fr) 44px; gap: 10px; align-items: center; font-size: 13px; }
.bar-line .lbl { color: var(--muted); font-weight: 600; }
.bar { height: 10px; border-radius: 999px; background: var(--field); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 999px; background: var(--accent); }
.bar-line .pct { font-family: var(--font-mono); font-size: 12px; text-align: right; }
.perf-note { font-size: 12px; color: var(--muted); margin: 0; }
.perf-faces { display: flex; padding-left: 6px; }
.perf-faces .face { margin-left: -6px; }
.face.xs { width: 32px; height: 32px; margin-top: 0; box-shadow: 0 0 0 2px #fff, 0 0 0 3px var(--line); }
.face.xs b { font-size: 13px; }

.face { width: 108px; height: 108px; border-radius: 50%; background: #fff; display: grid; place-items: center; overflow: hidden; flex: none;
  box-shadow: 0 0 0 10px #f4f4f2, 0 0 0 11px var(--line); margin-top: 10px; }
.face img { width: 100%; height: 100%; display: block; }
.face b { font-size: 36px; font-weight: 800; color: var(--muted); }
.face.empty-face { color: #c9c7c1; box-shadow: 0 0 0 10px #f8f8f6; }
.face.big { width: 120px; height: 120px; }
.face.sm { width: 48px; height: 48px; margin-top: 0; box-shadow: 0 0 0 4px #f4f4f2, 0 0 0 5px var(--line); }
.face.sm b { font-size: 18px; }
.face.sm.empty-face { box-shadow: 0 0 0 4px #f8f8f6; }
.agent-hero { margin: 4px 0 18px 10px; }

/* escritório isométrico: as faces de frente e do lado escurecem a cor do topo */
:root { --o-floor: #ece7df; --o-floor-accent: #d7efe6; --o-floor-warm: #f4e6d2; --o-wall: #dcd6cc; --o-desk: #c9a27c;
  --o-chair: #3b3f46; --o-monitor: #2a2d33; --o-window: #bfe0f0; --o-frame: #f1dcc4; --o-paper: #fbfbf8;
  --o-pot: #b8775a; --o-leaf: #6fa36b; --o-board: #fbfbf8; --o-cabinet: #a6abb3; --o-tag: #111113; --o-tag-fg: #fff; --o-bg: #f6f5f2; }
.office-wrap { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px; overflow-x: auto; margin-bottom: 28px; }
/* versão 3D: fundo bege de pôster, etiquetas em HTML por cima do canvas */
.office-wrap.is-3d { padding: 0; overflow: hidden; background: var(--o-bg); }
.o3d { position: relative; width: 100%; aspect-ratio: 16 / 11; }
@media (max-width: 720px) {
  .o3d-tag.room, .o3d-hint { display: none; }
  .o3d-tag.who { padding: 4px 8px; }
  .o3d-tag.who b { font-size: 10.5px; }
  .o3d-tag.who span { font-size: 9.5px; }
  .o3d-ctrl button { width: 30px; height: 30px; }
}
.o3d canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: pan-y; cursor: grab; }
.o3d-layer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.o3d-tag { position: absolute; left: 0; top: 0; margin-top: -6px; white-space: nowrap; font: 700 11px/1.25 var(--font-ui);
  padding: 4px 9px; border-radius: 8px; border: 0; background: rgba(255,255,255,.88); color: #2a2a2c; box-shadow: 0 1px 4px rgba(0,0,0,.14); text-align: center; }
.o3d-tag.who { background: #111113; color: #fff; padding: 5px 12px 5px 5px;
  display: flex; align-items: center; gap: 8px; text-align: left; border-radius: 999px; }
.o3d-tag.who img { width: 30px; height: 30px; border-radius: 50%; background: #fff; flex: none; }
.o3d-tag.who b { display: block; font-weight: 800; font-size: 12px; }
.o3d-tag.who span { display: block; font-size: 10.5px; font-weight: 600; opacity: .78; }
.o3d-tag.who.live span { color: #b8e8d6; opacity: 1; }
.o3d-tag.who::after { content: ""; position: absolute; left: 50%; bottom: -5px; margin-left: -5px; border: 5px solid transparent; border-bottom: 0; border-top-color: #111113; }
.o3d-ctrl { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 6px; }
.o3d-ctrl button { width: 34px; height: 34px; border-radius: 50%; border: 1px solid rgba(0,0,0,.1); background: rgba(255,255,255,.92); color: #222; font-size: 16px; line-height: 1; }
.o3d-hint { position: absolute; left: 12px; bottom: 14px; font-size: 11px; color: #6d655b; pointer-events: none; }
.office { display: block; width: 100%; min-width: 560px; height: auto; }
.office .f { filter: brightness(.88); }
.office .r { filter: brightness(.74); }
.floor .t, .floor .f, .floor .r { fill: var(--o-floor); }
.floor.accent polygon { fill: var(--o-floor-accent); }
.floor.warm polygon { fill: var(--o-floor-warm); }
.wall polygon { fill: var(--o-wall); }
.desk polygon { fill: var(--o-desk); }
.chair polygon { fill: var(--o-chair); }
.monitor polygon { fill: var(--o-monitor); }
.keyboard polygon { fill: var(--o-chair); }
.window polygon { fill: var(--o-window); }
.frame polygon { fill: var(--o-frame); }
.paper polygon { fill: var(--o-paper); }
.pot polygon { fill: var(--o-pot); }
.cabinet polygon { fill: var(--o-cabinet); }
.board polygon { fill: var(--o-board); }
.leaf { fill: var(--o-leaf); }
.room-label { font-size: 11px; font-weight: 700; fill: var(--fg); opacity: .75; letter-spacing: .02em;
  paint-order: stroke; stroke: var(--o-floor); stroke-width: 4px; stroke-linejoin: round; }
.room.has-agent { cursor: pointer; }
.room.has-agent:hover .floor polygon, .room.has-agent:focus-visible .floor polygon { filter: brightness(.94); }
.room:focus { outline: none; }
.room:focus-visible .room-label { fill: var(--fg); text-decoration: underline; }
.tag rect, .tag path { fill: var(--o-tag); }
.tag text { text-anchor: middle; fill: var(--o-tag-fg); }
.tag-name { font-size: 11px; font-weight: 800; }
.tag-sub { font-size: 9.5px; opacity: .75; }
.tag.live .tag-sub { opacity: 1; fill: var(--accent); }
.typing { animation: typing .9s ease-in-out infinite; }
@keyframes typing { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.5px); } }
.tag.live { animation: float 3s ease-in-out infinite; }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
.team-title { font-size: 15px; font-weight: 800; margin-bottom: 12px; }

/* detalhe do agente */
.back { border: 0; background: transparent; color: var(--muted); padding: 0; margin-bottom: 12px; font-weight: 600; }
.back:hover { color: var(--fg); }
.detail { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 24px; align-items: start; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; }
.role h2 { font-size: 15px; font-weight: 800; margin-bottom: 8px; }
.role p, .role li { font-size: 14px; color: var(--muted); }
.role ul { padding-left: 18px; margin: 8px 0 0; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 0; }
.chip { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--field); color: var(--fg); }
.chip.ok { background: var(--accent-soft); }

.day-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
.day-head h2 { font-size: 20px; font-weight: 800; letter-spacing: -0.01em; }
.date { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.focus { margin: 4px 0 16px; padding: 12px 14px; border-radius: 10px; background: var(--peach); font-size: 14px; }
.focus b { font-weight: 700; }

.options { display: flex; flex-direction: column; gap: 12px; }
.opt { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px;
  display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.opt.done { opacity: .55; }
.opt-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.force { font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; border: 1.5px solid currentColor; }
.force.forte { color: var(--strong); }
.force.medio { color: var(--mid); }
.force.fraco { color: var(--weak); }
.kind { font-size: 12px; color: var(--muted); font-weight: 600; }
.time { font-family: var(--font-mono); font-size: 12px; color: var(--muted); margin-left: auto; }
.opt h3 { font-size: 16px; font-weight: 800; }
.hook { font-size: 15px; margin: 0; padding-left: 12px; border-left: 3px solid var(--accent); }
.opt dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 12px; margin: 0; font-size: 14px; }
.opt dt { color: var(--muted); font-weight: 600; }
.opt dd { margin: 0; }
.src { font-family: var(--font-mono); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.acts { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--field); padding: 7px 14px; border-radius: 999px; font-size: 13px; font-weight: 700; }
.btn.primary { background: var(--fg); color: var(--bg); border-color: transparent; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }

.history h2 { font-size: 15px; font-weight: 800; margin-bottom: 10px; }
.history ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.history button { width: 100%; border: 0; background: transparent; text-align: left; padding: 8px 10px; border-radius: 8px;
  display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
.history button:hover { background: var(--field); }
.history button[aria-current="true"] { background: var(--accent-soft); font-weight: 700; }
.history .n { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }

/* agenda: semana do Google Agenda, horários livres para particular e o formulário de consulta */
.ag-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 14px; }
.ag-bar .week-nav { margin-right: auto; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--field); }
.seg button { border: 0; background: transparent; padding: 5px 14px; border-radius: 999px; font-size: 13px; font-weight: 700; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.ag-status { font-size: 12px; color: var(--muted); margin: 0 0 12px; }
.ag-warn { border: 1px solid #ecd9b8; background: #fbf4e6; border-radius: 10px; padding: 10px 14px; font-size: 13px; margin-bottom: 14px; }
.ag-warn .btn { margin-top: 8px; }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.week.one { grid-template-columns: minmax(0, 1fr); max-width: 560px; }
.day { border: 1px solid var(--line); border-radius: 12px; padding: 10px; min-height: 140px; display: flex; flex-direction: column; gap: 6px; min-width: 0; background: var(--panel); }
.day.today { border-color: var(--accent); box-shadow: inset 0 3px 0 var(--accent); }
.day.past { opacity: .6; }
.day h3 { font-size: 13px; font-weight: 800; display: flex; justify-content: space-between; gap: 6px; }
.day h3 span { font-family: var(--font-mono); font-weight: 500; color: var(--muted); }
.ev { border-radius: 8px; background: var(--field); padding: 6px 8px; font-size: 12.5px; min-width: 0; }
.ev b { display: block; font-family: var(--font-mono); font-size: 11px; font-weight: 500; color: var(--muted); }
.ev .t { display: block; font-weight: 700; overflow-wrap: anywhere; }
.ev .acts { margin-top: 4px; }
.ev .acts button, .ev .acts a { border: 0; background: transparent; padding: 0; font-size: 11.5px; font-weight: 700; color: var(--accent); text-decoration: none; }
.ev[style] b, .ev[style] .acts button, .ev[style] .acts a { color: inherit; opacity: .9; }
.ev[style] .acts button, .ev[style] .acts a { text-decoration: underline; }
.free { border: 1.5px solid var(--accent); background: transparent; color: #2f5d4f; border-radius: 8px; padding: 6px 8px; font-size: 12px; text-align: left; width: 100%; }
.free.maybe { border-style: dashed; }
.legend { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; font-size: 12.5px; font-weight: 700; margin: -4px 0 14px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i, .cats i, .mev i, .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.legend button, .ag-status button { border: 0; background: transparent; padding: 0; font-size: 12px; font-weight: 700; color: var(--accent); text-decoration: underline; }
.dot { vertical-align: -1px; margin-right: 4px; }
.sw { display: flex; flex-wrap: wrap; gap: 6px; }
.swb { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--line); padding: 0; }
.swb[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--fg); }
.cats { display: flex; flex-wrap: wrap; gap: 6px; }
.cats button { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 700; }
.cats button[aria-pressed="true"] { border-color: var(--fg); background: var(--field); }
.ag-form .lbl { font-size: 12px; font-weight: 700; color: var(--muted); }
.catrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.catrow input { width: 160px; }
.month { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.mhead, .mgrid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.mhead span { font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; padding: 8px; border-bottom: 1px solid var(--line); }
.mday { min-height: 104px; border: 0; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--panel); padding: 6px; text-align: left;
  display: flex; flex-direction: column; gap: 3px; min-width: 0; font: inherit; }
.mday:nth-child(7n) { border-right: 0; }
.mday:hover { background: var(--field); }
.mday.out { background: #fafaf8; color: var(--muted); }
.mday .n { font-size: 12px; font-weight: 800; font-family: var(--font-mono); }
.mday.today .n { background: var(--accent); color: #fff; border-radius: 999px; padding: 1px 7px; align-self: flex-start; }
.mev { display: block; font-size: 11.5px; font-weight: 600; line-height: 1.35; padding: 1px 6px; border-radius: 4px; min-width: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mev b { font-weight: 800; }
.mday .more { font-size: 11px; color: var(--muted); font-weight: 700; }
@media (max-width: 720px) {
  .mday { min-height: 76px; padding: 3px 2px; gap: 2px; }
  .mday .n { text-align: center; align-self: center; }
  .mev { font-size: 9px; padding: 0 3px; border-radius: 3px; }
  .mev b { display: none; }
  .mday .more { font-size: 9px; text-align: center; }
  .mhead span { padding: 6px 2px; text-align: center; font-size: 10px; }
}
/* conteúdo: pastas, banco de mídia e cronograma */
.ct-folders { margin-bottom: 14px; }
.ct-folders .n { font-family: var(--font-mono); font-size: 11px; color: var(--muted); font-weight: 500; }
.ct-new { display: inline-flex; gap: 6px; }
.ct-new input { font: inherit; font-size: 13px; padding: 5px 10px; border: 1px solid var(--line); border-radius: 999px; width: 160px; }
.ct-radio { border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; }
.ct-radio legend { font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 4px; padding: 0; }
.ct-radio label { flex-direction: row; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600; color: var(--fg); }
.ct-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.ct-card { position: relative; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; padding: 0; background: var(--field); text-align: left; display: flex; flex-direction: column; min-width: 0; }
.ct-card.on { outline: 2px solid var(--accent); outline-offset: 1px; }
.ct-card .th { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; display: block; background: #e9e8e4; }
.ct-tags { position: absolute; top: 6px; left: 6px; right: 6px; display: flex; flex-wrap: wrap; gap: 4px; }
.ct-tags span { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; padding: 2px 7px; border-radius: 999px; background: rgba(17,17,19,.72); color: #fff; }
.ct-tags .st-analisado, .ct-tags .st-agendado { background: var(--accent); }
.ct-tags .warn { background: var(--bad); }
.ct-cap { font-size: 12px; font-weight: 600; padding: 7px 9px; background: var(--panel); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ct-detail { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 16px; border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 16px; }
.ct-big img, .ct-big video { width: 100%; max-height: 70vh; object-fit: contain; border-radius: 10px; background: #111; display: block; }
.ct-info { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.ct-info h2 { font-size: 17px; font-weight: 800; overflow-wrap: anywhere; }
.ct-info .hint { font-size: 12px; color: var(--muted); margin: 0; }
.ct-info .hint.bad { color: var(--bad); }
.ct-info label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 700; color: var(--muted); }
.ct-info select { font: inherit; font-size: 14px; color: var(--fg); padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
.ct-ana { background: var(--field); border-radius: 10px; padding: 10px 12px; font-size: 13.5px; }
.ct-ana p { margin: 4px 0; }
.ct-ana ul { margin: 4px 0 0; padding-left: 18px; }
.ct-info .acts, .post .acts, .ag-form .acts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.posts { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
.posts.old { margin-top: 12px; opacity: .75; }
.post { border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.post.st-aprovado { border-color: var(--accent); }
.post.st-postado, .post.st-descartado { opacity: .7; }
.post h3 { font-size: 16px; font-weight: 800; }
.post .hint { font-size: 12.5px; color: var(--muted); margin: 0; }
.post .hook { margin: 0; font-weight: 700; }
.post-st { margin-left: auto; font-size: 11px; font-weight: 700; color: var(--muted); }
.post-media { display: flex; gap: 6px; overflow-x: auto; }
.post-media .pm { width: 84px; height: 105px; object-fit: cover; border-radius: 8px; flex: none; background: #e9e8e4; }
.legenda { background: var(--field); border-radius: 10px; padding: 10px 12px; font-size: 13.5px; }
.legenda p { margin: 4px 0 8px; white-space: pre-wrap; }
.ct-ed { margin: 0; font-size: 13px; font-weight: 600; color: #3f6f60; display: flex; flex-direction: column; gap: 6px; }
.ct-ed.bad { color: var(--bad); }
.ct-ed video { width: 100%; max-height: 420px; border-radius: 10px; background: #111; }
.ct-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.tile { position: relative; aspect-ratio: 1; border: 0; border-radius: 16px; overflow: hidden; padding: 14px; text-align: left; font: inherit;
  display: flex; flex-direction: column; justify-content: flex-end; color: #fff; background: linear-gradient(160deg, #6fa594, #3f6f60); isolation: isolate; }
.tile:nth-child(5n+2) { background: linear-gradient(160deg, #d29a6b, #a5683f); }
.tile:nth-child(5n+3) { background: linear-gradient(160deg, #7f8fc4, #4f5d94); }
.tile:nth-child(5n+4) { background: linear-gradient(160deg, #c98aa0, #94546d); }
.tile:nth-child(5n+5) { background: linear-gradient(160deg, #8c8f97, #5d6068); }
.tile .tile-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; }
.tile:has(.tile-bg)::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.05) 30%, rgba(0,0,0,.65)); z-index: -1; }
.tile-n { font-size: 40px; font-weight: 800; line-height: 1; font-family: var(--font-mono); }
.tile-name { font-size: 15px; font-weight: 800; margin-top: 4px; text-wrap: balance; }
.tile:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(17,17,19,.14); }
.tile { transition: transform .15s ease, box-shadow .15s ease; }
.tile.new { background: var(--field); color: var(--muted); border: 1.5px dashed #cfcdc6; justify-content: center; align-items: center; text-align: center; gap: 8px; }
.tile.new input { font: inherit; font-size: 14px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; width: 100%; }
.tile.tile-ad { background: linear-gradient(160deg, #8a5a33, #4a2410); }

/* pacientes: lista com busca, ficha e comparação antes/depois */

.pc-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
.pc-item { display: grid; gap: 4px; text-align: left; border: 1px solid var(--line); border-radius: 14px; padding: 8px; background: var(--panel); font: inherit; }
.pc-item img, .pc-ini { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 10px; background: var(--field); }
.pc-ini { display: grid; place-items: center; font-size: 32px; font-weight: 800; color: var(--muted); }
.pc-nome { font-weight: 800; overflow-wrap: anywhere; }
.pc-item:hover { border-color: var(--accent); }
.pc-cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 8px 0 16px; }
.pc-cmp figure { margin: 0; display: grid; gap: 6px; }
.pc-cmp figcaption { font-size: 13px; font-weight: 800; color: var(--muted); }
.pc-cmp img, .pc-vazio { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 12px; background: var(--field); }
.pc-vazio { display: grid; place-items: center; color: var(--muted); font-size: 13px; text-align: center; padding: 8px; }
.pc-fase { margin-top: 16px; }
.pc-fase h3, .pc-dados h3 { font-size: 15px; margin: 0 0 8px; }
.pc-fase h3 span { color: var(--muted); font-family: var(--font-mono); font-weight: 500; }
.pc-ths { display: flex; flex-wrap: wrap; gap: 8px; }
.pc-th { position: relative; width: 104px; border: 2px solid transparent; border-radius: 12px; padding: 0; overflow: hidden; background: var(--field); font: inherit; }
.pc-th img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; }
.pc-th span { position: absolute; left: 0; right: 0; bottom: 0; font-size: 10px; padding: 2px 4px; background: rgba(0,0,0,.55); color: #fff; }
.pc-th.on { border-color: var(--accent); }

.pc-ver img { width: 100%; max-height: 70vh; object-fit: contain; border-radius: 12px; background: #111; }
.pc-dados { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--line); display: grid; gap: 8px; }

.pc-rets { display: grid; gap: 8px; margin-bottom: 16px; }
.pc-rets h2 { font-size: 16px; margin: 0; }
.pc-ret { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 12px; padding: 10px 12px; background: var(--panel); }
.pc-ret.atrasado { border-left-color: var(--bad); }
.pc-ret .pc-ret-txt { flex: 1 1 200px; min-width: 0; display: grid; gap: 2px; }
.pc-ret .pc-ret-txt b { overflow-wrap: anywhere; }
.pc-ret .quando { font-size: 13px; color: var(--muted); }
.pc-ret.atrasado .quando { color: var(--bad); font-weight: 700; }
.pc-ret .acts { display: flex; flex-wrap: wrap; gap: 6px; }
.pc-ret a.btn { text-decoration: none; color: inherit; }
.pc-retform { display: grid; gap: 8px; border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: var(--field); }
.pc-retform input { font: inherit; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
.pc-dados input[type="tel"] { font: inherit; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--field); }
/* desafios diários na aba Conteúdo */
.ds-seg { flex-wrap: wrap; border-radius: 16px; }
.ds-resumo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.ds-resumo > div { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; background: var(--panel); display: grid; gap: 6px; align-content: start; }
.ds-big { font-size: 28px; font-weight: 800; line-height: 1; }
.ds-big small { font-size: 14px; color: var(--muted); font-weight: 700; }
.ds-dias { display: flex; gap: 4px; }
.ds-dias span { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 800; background: var(--field); color: var(--muted); }
.ds-dias span.on { background: var(--accent); color: #fff; }
.ds-dias span.hoje { outline: 2px solid var(--fg); outline-offset: 1px; }
.ds-barra { height: 8px; border-radius: 99px; background: var(--field); overflow: hidden; }
.ds-barra i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.ds-card, .ds-fim { border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; background: var(--panel); display: grid; gap: 8px; }
.ds-card h2, .ds-fim h2 { margin: 0; font-size: 22px; }
.ds-card h3 { margin: 6px 0 0; font-size: 14px; }
.ds-top { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.ds-n { font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); margin-right: 4px; }
.ds-porque { margin: 0; }
.ds-passos { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.ds-rot { background: var(--accent-soft); border-radius: 12px; padding: 10px 14px; display: grid; gap: 4px; }
.ds-rot p { margin: 0; }
.ds-rot .btn { justify-self: start; margin-top: 4px; background: var(--panel); }
.ds-min { margin: 0; padding: 8px 12px; border-radius: 10px; background: var(--field); font-size: 14px; }
.ds-ok { font-weight: 800; color: var(--accent); }
.ds-regra { margin-top: 12px; }
.ds-nivel { margin-bottom: 18px; }
.ds-nivel h2 { font-size: 17px; margin: 0 0 2px; }
.ds-nivel h2 span { color: var(--muted); font-family: var(--font-mono); font-weight: 500; font-size: 14px; }
.ds-lista { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 6px; }
.ds-item { width: 100%; display: grid; grid-template-columns: 30px 1fr; column-gap: 10px; align-items: center; text-align: left; border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; background: var(--panel); font: inherit; }

.ds-tit { font-weight: 700; }
.ds-item.feito .ds-num { background: var(--accent); color: #fff; }

.ds-item.atual { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.ds-item.atual .ds-num { background: var(--fg); color: var(--bg); }
@media (max-width: 520px) { .ds-resumo { grid-template-columns: 1fr; } }
.nav .pc-badge { margin-left: auto; min-width: 20px; padding: 1px 6px; border-radius: 999px; background: var(--bad); color: #fff; font-size: 11px; font-weight: 800; text-align: center; }
.ct-title { font-size: 20px; font-weight: 800; margin: 4px 0 14px; }
.ct-title span { font-family: var(--font-mono); font-size: 14px; color: var(--muted); font-weight: 500; }
.ct-tags .ok { background: #2f8a5f; }
.fb { border-radius: 12px; padding: 12px 14px; font-size: 13.5px; border: 1.5px solid; }
.fb b { font-size: 15px; }
.fb b span { font-weight: 600; font-size: 12px; opacity: .7; }
.fb p { margin: 6px 0; }
.fb h4 { margin: 10px 0 2px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
.fb ul { margin: 2px 0; padding-left: 18px; }

.fb.bad { background: #fbeceb; border-color: #e8a39a; color: #8a2d22; }

.fb .acts { margin-top: 10px; }

.fb-ed { font-weight: 700; margin: 10px 0 0 !important; }
.ct-more { font-size: 13px; }

.ed-group { margin-bottom: 22px; }
.ed-group h2 { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 10px; }
.ed-group h2 span { font-family: var(--font-mono); color: var(--muted); }
.ed-list { display: flex; flex-direction: column; gap: 10px; }
.ed-item { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 14px; border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; border-left: 4px solid var(--line); }
.ed-item.st-editando { border-left-color: var(--mid); }
.ed-item.st-pedida { border-left-color: var(--weak); }
.ed-item.st-pronta { border-left-color: #2f8a5f; }
.ed-item.st-falhou { border-left-color: var(--bad); }
.ed-media video, .ed-media .pm { width: 100%; max-height: 320px; aspect-ratio: 9 / 16; object-fit: cover; border-radius: 10px; background: #111; display: block; height: auto; }
.ed-info { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.ed-info h3 { font-size: 16px; font-weight: 800; }
.ed-info p { margin: 0; font-size: 13.5px; }
.ed-info .hint { font-size: 12.5px; color: var(--muted); }
@media (max-width: 720px) {
  .ct-tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }

  .tile-name { font-size: 13.5px; }
  .ed-item { grid-template-columns: 110px minmax(0, 1fr); }
}
.link-btn { border: 0; background: transparent; padding: 0; margin-top: 14px; font-size: 13px; font-weight: 700; color: var(--accent); text-decoration: underline; }
@media (max-width: 720px) {
  .ct-detail { grid-template-columns: minmax(0, 1fr); }
  .ct-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .posts { grid-template-columns: minmax(0, 1fr); }
}

  // ---------- rendimento da semana (segunda a domingo) ----------
  function isoOf(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function weekRange(offset) {
    var d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - (d.getDay() + 6) % 7 - 7 * offset);
    var end = new Date(d); end.setDate(d.getDate() + 6);

  function shortDay(d) { return d.getDate() + ' ' + MESES[d.getMonth()]; }

  // Duda: entrega = dias com opções / dias que ela já devia ter trabalhado; aproveitamento = opções feitas / opções entregues
  function dudaWeek(offset) {
    var w = weekRange(offset), s = isoOf(w.start), e = isoOf(w.end), today = todayIso();
    var all = state.days.map(function (d) { return d.data; }).sort();
    if (!all.length || all[0] > e) return null;
    var from = all[0] > s ? all[0] : s, to = today < e ? today : e;
    var p1 = from.split('-'), p2 = to.split('-');
    var due = Math.max(1, Math.round((new Date(+p2[0], +p2[1] - 1, +p2[2]) - new Date(+p1[0], +p1[1] - 1, +p1[2])) / DAY_MS) + 1);
    var days = state.days.filter(function (d) { return d.data >= s && d.data <= e; });
    var total = 0, feitas = 0, desc = 0;
    days.forEach(function (d) {
      total += (d.opcoes || []).length;
      Object.keys(d.estado || {}).forEach(function (k) { if (d.estado[k] === 'feito') feitas++; else if (d.estado[k] === 'descartado') desc++; });
    });
    return { delivered: days.length, due: due, total: total, feitas: feitas, desc: desc };
  }

  // ---------- agenda (Google Agenda pelo conector do claude.ai) ----------

  var GCAL = 'Google Calendar';

  var FREE = {

  var SPEC = /especializa|prime|m[óo]dulo/i;
  var DIAS = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
  // as 11 cores de evento do Google Agenda (colorId -> nome, cor); '' = cor padrão da agenda

    '5': ['Banana', '#f6bf26'], '6': ['Tangerina', '#f4511e'], '7': ['Pavão', '#039be5'], '8': ['Grafite', '#616161'], '9': ['Mirtilo', '#3f51b5'],
    '10': ['Manjericão', '#0b8043'], '11': ['Tomate', '#d50000'] };
  var COR_IDS = ['6', '11', '4', '5', '10', '2', '7', '9', '1', '3', '8'];
  function cor(id) { return CORES[id || ''] || CORES['']; }
  function corFg(id) { return id === '5' ? '#3a2c00' : '#fff'; }
  var ag = { mcp: null, ready: false, week: 0, view: 'semana', day: null, month: new Date(new Date().getFullYear(), new Date().getMonth(), 1), events: null, error: null, storedAt: null, key: null, unwatch: null,
    form: null, confirm: false, busy: false, msg: null, cats: null, editCats: null, catsErr: null };
  // categorias (nome -> cor) ficam no banco do painel, em config/agenda: não têm dado de paciente
  function catOf(colorId) { return (ag.cats || []).find(function (c) { return c.cor === (colorId || ''); }); }

  function pad(n) { return String(n).padStart(2, '0'); }

  function localStamp(dateIso, time) { return dateIso + 'T' + time + ':00'; }
  function addMin(dateIso, time, min) {

  // mês = semanas inteiras (segunda a domingo) que cobrem o mês
  function monthGrid() {
    var y = ag.month.getFullYear(), m = ag.month.getMonth();
    var start = new Date(y, m, 1); start.setDate(1 - (start.getDay() + 6) % 7);
    var end = new Date(y, m + 1, 0); end.setDate(end.getDate() + 7 - (end.getDay() + 6) % 7);
    return { start: start, end: end };
  }
  function agRange() {
    if (ag.view === 'mes') { var g = monthGrid(); return { startTime: isoOf(g.start) + 'T00:00:00', endTime: isoOf(g.end) + 'T00:00:00' }; }
    var w = weekRange(ag.week), end = new Date(w.start); end.setDate(end.getDate() + 7);
    return { startTime: isoOf(w.start) + 'T00:00:00', endTime: isoOf(end) + 'T00:00:00' };
  }
  function eventsOn(iso, evs) {

  // assina a semana que está na tela; chamado na navegação, nunca dentro do render
  function agWatch() {
    if (!ag.mcp) return;
    var input = Object.assign({ orderBy: 'startTime', pageSize: 250 }, agRange());
    var key = input.startTime + '/' + input.endTime;
    if (ag.key === key) return;
    if (ag.unwatch) ag.unwatch();
    ag.key = key; ag.events = null; ag.error = null;
    ag.unwatch = ag.mcp.watchTool(GCAL, 'list_events', input, function (ev) {

        ag.error = null;
      } else {
        ag.error = ev.error || { code: 'upstream_error' };
        // sem permissão ou sem conector: some o que estava na tela
        if (/needs_reauth|server_not_connected|blocked_by_policy|approval_required|not_in_manifest|selection_required/.test(ag.error.code)) ag.events = null;
      }

  }

  function agRefresh() {
    if (!ag.mcp) return Promise.resolve();
    var input = Object.assign({ orderBy: 'startTime', pageSize: 250 }, agRange());
    return ag.mcp.callTool(GCAL, 'list_events', input, { cache: { refresh: true, staleTime: 60000, gcTime: 600000 } }).catch(function () {});
  }

  function agErrorText(e) {
    switch (e && e.code) {
      case 'needs_reauth': return 'A conexão com o Google Agenda expirou. Reconecte em claude.ai → Configurações → Conectores.';
      case 'server_not_connected': return 'O Google Agenda não está conectado. Adicione em claude.ai → Configurações → Conectores.';
      case 'selection_required': return 'Há mais de um Google Agenda conectado. Escolha qual usar quando o claude.ai perguntar.';
      case 'approval_required': case 'not_in_manifest': return 'O painel precisa da sua permissão para ler o Google Agenda.';
      case 'blocked_by_policy': return 'A sua organização bloqueou o Google Agenda neste painel.';
      case 'server_unavailable': return 'O Google Agenda não respondeu agora. A agenda tenta de novo sozinha a cada 2 minutos.';
      case 'tool_error': return 'O Google Agenda recusou o pedido: ' + (e.message || '');
      case 'not_granted': case 'capability_disabled': case 'capability_removed': return 'A agenda só carrega abrindo o painel pelo claude.ai.';
      default: return 'Não deu para ler o Google Agenda agora.';
    }
  }

  // horário livre = janela do dia menos os eventos que caem nela (sobras de 1h ou mais)
  function freeSlots(d, evs) {
    var w = FREE[d.getDay()]; if (!w) return [];
    if (evs.some(function (e) { return SPEC.test(e.summary || ''); })) return [{ block: true }];
    var a = new Date(d); a.setHours(w.from, 0, 0, 0);
    var b = new Date(d); b.setHours(w.to, 0, 0, 0);
    var now = new Date(); if (now > a) { a = new Date(now); a.setMinutes(a.getMinutes() < 30 ? 30 : 60, 0, 0); }
    var busy = evs.filter(function (e) { return !allDay(e); }).map(function (e) { return [evStart(e), evEnd(e)]; })
      .filter(function (x) { return x[0] && x[1] && x[1] > a && x[0] < b; }).sort(function (x, y) { return x[0] - y[0]; });
    var out = [], cur = a;
    busy.forEach(function (x) { if (x[0] - cur >= 3600000) out.push([cur, x[0]]); if (x[1] > cur) cur = x[1]; });
    if (b - cur >= 3600000) out.push([cur, b]);
    return out.map(function (x) { return { from: x[0], to: x[1], place: w.place, sure: w.sure }; });
  }

  // eventos que se cruzam dividem a largura da coluna (como no Google)
  function lanes(list) {
    var out = [], group = [], groupEnd = 0;
    function flush() { var n = 0; group.forEach(function (x) { n = Math.max(n, x.lane + 1); }); group.forEach(function (x) { x.n = n; out.push(x); }); group = []; }
    list.forEach(function (e) {
      var s = evStart(e), en = evEnd(e); if (!s || !en) return;
      if (group.length && s >= groupEnd) flush();
      var used = group.filter(function (x) { return x.end > s; }).map(function (x) { return x.lane; }), lane = 0;
      while (used.indexOf(lane) >= 0) lane++;
      group.push({ e: e, start: s, end: en, lane: lane }); groupEnd = Math.max(groupEnd, +en);
    });
    flush(); return out;
  }

  // semana (7 colunas) ou dia (1 coluna): grade de horários com as barras dos eventos
  function timeGrid(days, evs) {
    var today = todayIso(), h0 = 7, h1 = 21;
    var per = days.map(function (d) { return eventsOn(isoOf(d), evs); });
    per.forEach(function (list) { list.forEach(function (e) {
      if (allDay(e)) return;
      var s = evStart(e), en = evEnd(e);
      h0 = Math.min(h0, s.getHours()); h1 = Math.max(h1, isoOf(en) > isoOf(s) ? 24 : Math.ceil(en.getHours() + en.getMinutes() / 60));
    }); });
    var PH = window.matchMedia('(max-width: 720px)').matches ? 38 : 46;
    function y(dt, iso) { var h = isoOf(dt) < iso ? h0 : isoOf(dt) > iso ? h1 : dt.getHours() + dt.getMinutes() / 60; return (Math.min(Math.max(h, h0), h1) - h0) * PH; }
    var head = '<div class="tg-row tg-head"><div></div>' + days.map(function (d) {
      var iso = isoOf(d);
      return '<div class="' + (iso === today ? 'today' : '') + '"><span class="dn">' + DIAS[d.getDay()] + '</span><span class="dd">' + d.getDate() + '</span></div>';
    }).join('') + '</div>';
    var hasAll = per.some(function (l) { return l.some(allDay); });
    var all = hasAll ? '<div class="tg-row tg-all"><div class="lbl">dia todo</div>' + per.map(function (l) {
      return '<div>' + l.filter(allDay).map(function (e) {
        return '<span class="alld" style="background:' + cor(e.colorId)[1] + ';color:' + corFg(e.colorId) + '" title="' + esc(e.summary || '') + '">' + esc(e.summary || '(sem título)') + '</span>';
      }).join('') + '</div>';
    }).join('') + '</div>' : '';
    var hours = ''; for (var h = h0; h < h1; h++) hours += '<div>' + (h > h0 ? pad(h) + ':00' : '') + '</div>';
    var cols = days.map(function (d, i) {
      var iso = isoOf(d), list = per[i], html = '';
      if (iso >= today) freeSlots(d, list).forEach(function (f) {
        if (f.block) { html += '<div class="tblock" style="top:0;bottom:0">Especialização: sem paciente</div>'; return; }
        var top = y(f.from, iso), hgt = y(f.to, iso) - top;
        html += '<button type="button" class="tfree' + (f.sure ? '' : ' maybe') + '" data-ag-new="' + iso + '" data-ag-time="' + hm(f.from) + '" style="top:' + top + 'px;height:' + hgt + 'px" title="' +
          esc((f.sure ? 'Livre para particular' : 'Talvez, a negociar') + ' · ' + hm(f.from) + '–' + hm(f.to) + ' · ' + f.place) + '">' + (f.sure ? 'Livre' : 'Talvez') + '<span> · ' + esc(f.place) + '</span></button>';
      });
      lanes(list.filter(function (e) { return !allDay(e); })).forEach(function (x) {
        var e = x.e, top = y(x.start, iso), hgt = Math.max(y(x.end, iso) - top, 16), w = 100 / x.n, c = catOf(e.colorId);
        html += '<button type="button" class="tev" data-ag-move="' + esc(e.id) + '" style="top:' + top + 'px;height:' + (hgt - 1) + 'px;left:calc(' + (x.lane * w) + '% + 2px);width:calc(' + w + '% - 4px);background:' +
          cor(e.colorId)[1] + ';color:' + corFg(e.colorId) + '" title="' + esc((e.summary || '') + ' · ' + hm(x.start) + '–' + hm(x.end) + (c ? ' · ' + c.nome : '')) + '">' +
          '<span class="t">' + esc(e.summary || '(sem título)') + '</span>' + (hgt >= 32 ? '<span class="h">' + hm(x.start) + '–' + hm(x.end) + '</span>' : '') + '</button>';
      });
      if (iso === today) { var n = new Date(), nh = n.getHours() + n.getMinutes() / 60; if (nh >= h0 && nh <= h1) html += '<div class="tnow" style="top:' + (nh - h0) * PH + 'px"></div>'; }
      return '<div class="tg-col' + (iso < today ? ' past' : '') + '">' + html + '</div>';
    }).join('');
    return '<div class="tg" style="--n:' + days.length + '">' + head + all +
      '<div class="tg-row tg-body" style="height:' + (h1 - h0) * PH + 'px"><div class="tg-hours">' + hours + '</div>' + cols + '</div></div>';
  }

  function monthView(evs) {
    var g = monthGrid(), today = todayIso(), m = ag.month.getMonth(), cells = [];
    for (var d = new Date(g.start); d < g.end; d.setDate(d.getDate() + 1)) {
      var iso = isoOf(d), list = eventsOn(iso, evs);
      var chips = list.slice(0, 4).map(function (e) {
        return '<span class="mev" style="background:' + cor(e.colorId)[1] + ';color:' + corFg(e.colorId) + '">' + (allDay(e) ? '' : '<b>' + hm(evStart(e)) + '</b> ') + esc(e.summary || '(sem título)') + '</span>';
      }).join('') + (list.length > 4 ? '<span class="more">+' + (list.length - 4) + ' mais</span>' : '');
      cells.push('<button type="button" class="mday' + (d.getMonth() !== m ? ' out' : '') + (iso === today ? ' today' : '') + '" data-ag-goday="' + iso + '" aria-label="' + esc(fmtDay(iso)) + ', ' + list.length + ' eventos">' +
        '<span class="n">' + d.getDate() + '</span>' + chips + '</button>');

  }

  // bolinhas de cor: categorias primeiro, depois as 11 cores do Google
  function swatches(sel, attr, withDefault) {

      var c = cor(id), k = catOf(id);
      return '<button type="button" class="swb" ' + attr + '="' + id + '" aria-pressed="' + (sel === id) + '" title="' + esc(c[0] + (k ? ' · ' + k.nome : '')) + '" style="background:' + c[1] + '"></button>';
    }).join('') + '</div>';
  }

  function legend() {
    if (ag.editCats) {
      return '<div class="ag-form"><h2>Categorias e cores</h2><p class="hint">A cor é a mesma do Google Agenda. Mudar aqui não repinta eventos que já existem.</p>' +
        ag.editCats.map(function (c, i) {

            swatches(c.cor, 'data-ag-cc="' + i + '" data-v', false) +
            '<button type="button" class="btn" data-ag-cdel="' + i + '" aria-label="Tirar ' + esc(c.nome) + '">Tirar</button></div>';
        }).join('') +
        (ag.catsErr ? '<p class="hint bad">' + esc(ag.catsErr) + '</p>' : '') +
        '<div class="acts"><button type="button" class="btn" data-ag-cadd="1">+ Categoria</button>' +

    }

      (cats.length ? '' : '<span class="ag-empty">Sem categorias de cor ainda.</span>') +
      (state.db ? '<button type="button" data-ag-cedit="1">Editar cores</button>' : '') + '</div>';
  }

  function agForm() {
    var f = ag.form; if (!f) return '';
    var moving = f.mode === 'move';
    var looksName = !moving && /^[A-ZÀ-Ý][a-zà-ÿ]+\s+[A-ZÀ-Ý][a-zà-ÿ]+/.test(f.title || '');
    var end = addMin(f.date, f.time, +f.dur), k = catOf(f.color);
    var dot = '<i class="dot" style="background:' + cor(f.color)[1] + '"></i>' + esc(k ? k.nome : cor(f.color)[0]);
    if (ag.confirm) {
      return '<div class="ag-form"><h2>Confirmar ' + (moving ? 'mudança' : 'evento') + '</h2><div class="ag-confirm">' +
        (moving ? 'Mudar <b>' + esc(f.title) + '</b> para ' : 'Criar <b>' + esc(f.title) + '</b> em ') +
        '<b>' + esc(fmtDay(f.date)) + ', ' + f.time + '–' + end.time + '</b>' + (!moving && f.place ? ' · ' + esc(f.place) : '') + ', no seu Google Agenda?' +
        (!moving || f.color !== f.color0 ? '<br>Cor: ' + dot : '') + '</div>' +
        (looksName ? '<p class="hint bad">O título parece um nome completo. Prefira só as iniciais ou um código (LGPD). Volte para mudar, se quiser.</p>' : '') +
        '<div class="acts"><button type="button" class="btn primary" data-ag-do="1"' + (ag.busy ? ' disabled' : '') + '>' + (ag.busy ? 'Gravando…' : 'Confirmar') + '</button>' +
        '<button type="button" class="btn" data-ag-back="1"' + (ag.busy ? ' disabled' : '') + '>Voltar</button></div></div>';
    }
    var cats = ag.cats || [];
    return '<div class="ag-form"><h2>' + (moving ? 'Editar evento' : 'Novo evento') + '</h2>' +
      (moving ? '<p class="hint">' + esc(f.title) + ' · hoje: ' + esc(f.was) +
        (f.link ? ' · <a href="' + esc(f.link) + '" target="_blank" rel="noopener">abrir no Google</a>' : '') + '</p>' : '') +
      (cats.length ? '<div class="cats" role="group" aria-label="Categoria">' + cats.map(function (c, i) {
        return '<button type="button" data-ag-cat="' + i + '" aria-pressed="' + (f.color === c.cor) + '"><i style="background:' + cor(c.cor)[1] + '"></i>' + esc(c.nome) + '</button>';
      }).join('') + '</div>' : '') +
      '<div class="grid"><label>Dia<input type="date" data-ag-f="date" value="' + esc(f.date) + '"></label>' +
      '<label>Início<input type="time" step="900" data-ag-f="time" value="' + esc(f.time) + '"></label>' +
      (moving ? '' : '<label>Duração<select data-ag-f="dur">' + [30, 45, 60, 90, 120, 180, 240].map(function (m) { return '<option value="' + m + '"' + (+f.dur === m ? ' selected' : '') + '>' + (m < 120 ? m + ' min' : m / 60 + ' h') + '</option>'; }).join('') + '</select></label>' +
        '<label>Local<select data-ag-f="place">' + PLACES.concat(['']).map(function (p) { return '<option value="' + esc(p) + '"' + (f.place === p ? ' selected' : '') + '>' + (p ? esc(p) : 'outro / sem local') + '</option>'; }).join('') + '</select></label>') +
      '</div>' +
      (moving ? '' : '<label>Título<input type="text" maxlength="80" data-ag-f="title" placeholder="M.S. · limpeza  ou  Academia" value="' + esc(f.title) + '"></label>' +
        '<p class="hint">Paciente: só as iniciais ou um código e o procedimento (LGPD). Ex.: "M.S. · limpeza".</p>') +
      '<div class="lbl">Cor: ' + dot + '</div>' + swatches(f.color, 'data-ag-color', !moving || f.color0 === '') +
      (ag.formErr ? '<p class="hint bad">' + esc(ag.formErr) + '</p>' : '') +
      '<div class="acts"><button type="button" class="btn primary" data-ag-review="1">Revisar</button>' +
      '<button type="button" class="btn" data-ag-cancel="1">Cancelar</button></div></div>';
  }

  function renderAgenda() {
    var w = weekRange(ag.week);
    var head = '<header class="page-head"><span class="eyebrow">Agenda</span><h1>Agenda</h1>' +
      '<p>É o seu próprio Google Agenda: o que você marca no celular aparece aqui, e o que você cria aqui aparece no celular, com a mesma cor. Os horários livres para particular ficam com contorno verde. Criar e editar pedem a sua confirmação.</p></header>';
    var MES_LONGO = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
    var title = ag.view === 'dia' ? fmtDay(ag.day) : ag.view === 'mes' ? MES_LONGO[ag.month.getMonth()] + ' ' + ag.month.getFullYear() : shortDay(w.start) + ' – ' + shortDay(w.end);
    var bar = '<div class="ag-bar"><div class="week-nav"><button type="button" data-ag-step="-1" aria-label="Anterior">‹</button><span>' + esc(title) + '</span>' +
      '<button type="button" data-ag-step="1" aria-label="Seguinte">›</button><button type="button" class="btn" data-ag-today="1" style="width:auto;border-radius:999px;padding:4px 12px">Hoje</button></div>' +
      '<div class="seg" role="group" aria-label="Visão">' + [['dia', 'Dia'], ['semana', 'Semana'], ['mes', 'Mês']].map(function (v) {
        return '<button type="button" data-ag-view="' + v[0] + '" aria-pressed="' + (ag.view === v[0]) + '">' + v[1] + '</button>'; }).join('') + '</div>' +
      '<button type="button" class="btn primary" data-ag-new="' + (ag.view === 'dia' ? ag.day : todayIso()) + '" data-ag-time="14:00">+ Novo evento</button></div>';
    if (!ag.ready) return head + '<p class="note">Conectando ao Google Agenda…</p>';
    if (!ag.mcp) return head + '<div class="empty"><b>A agenda ainda não está ligada neste site.</b> Por enquanto, use a Agenda pelo painel no claude.ai. A ligação com o Google é a próxima etapa.</div>';
    var status = '';
    if (ag.msg) status += '<div class="ag-warn">' + esc(ag.msg) + '</div>';

      (/approval_required|not_in_manifest|server_unavailable|upstream_error/.test(ag.error.code) ? '<br><button type="button" class="btn" data-ag-allow="1">' + (/approval|manifest/.test(ag.error.code) ? 'Permitir e carregar' : 'Tentar de novo') + '</button>' : '') + '</div>';
    if (ag.events && ag.storedAt) status += '<p class="ag-status">Google Agenda · atualizado às ' + hm(new Date(ag.storedAt)) + ' · <button type="button" data-ag-allow="1">atualizar agora</button></p>';

    else {
      var days = []; for (var i = 0; i < 7; i++) { var d = new Date(w.start); d.setDate(d.getDate() + i); days.push(d); }

  }

  function agSave() {
    var f = ag.form; if (!f || ag.busy) return;
    var end = addMin(f.date, f.time, +f.dur);
    var call = f.mode === 'move'
      ? ag.mcp.callTool(GCAL, 'update_event', Object.assign({ eventId: f.id, startTime: localStamp(f.date, f.time), endTime: localStamp(end.date, end.time) }, f.color && f.color !== f.color0 ? { colorId: f.color } : {}))
      : ag.mcp.callTool(GCAL, 'create_event', Object.assign({ summary: f.title.trim(), startTime: localStamp(f.date, f.time), endTime: localStamp(end.date, end.time) }, f.place ? { location: f.place } : {}, f.color ? { colorId: f.color } : {}));
    ag.busy = true; render();
    call.then(function () {

    }, function (e) {

        ? 'O Google Agenda não confirmou a gravação. Pode ter ido: confira a semana antes de tentar de novo.'

  }

  function agClick(t) {
    var a;

      var s0 = evStart(e), e0 = evEnd(e);
      ag.form = { mode: 'move', id: e.id, title: e.summary || '(sem título)', date: isoOf(s0), time: hm(s0), dur: Math.round((e0 - s0) / 60000),
        was: fmtDay(isoOf(s0)) + ', ' + hm(s0) + '–' + hm(e0), color: e.colorId || '', color0: e.colorId || '',

      ag.confirm = false; ag.formErr = null; ag.msg = null; render(); window.scrollTo(0, 0); return true;
    }
    if ((a = t.closest('[data-ag-cat]'))) { var c0 = (ag.cats || [])[+a.getAttribute('data-ag-cat')]; if (c0 && ag.form) ag.form.color = c0.cor; render(); return true; }
    if ((a = t.closest('[data-ag-color]'))) { if (ag.form) ag.form.color = a.getAttribute('data-ag-color'); render(); return true; }
    if (t.closest('[data-ag-review]')) {
      var f = ag.form;
      ag.formErr = !f.date || !f.time ? 'Escolha o dia e o horário.' : f.mode === 'new' && !(f.title || '').trim() ? 'Escreva um título.' : null;
      ag.confirm = !ag.formErr; render(); return true;
    }
    // editor de categorias
    if (t.closest('[data-ag-cedit]')) { ag.editCats = (ag.cats || []).map(function (c) { return { nome: c.nome, cor: c.cor }; }); ag.catsErr = null; render(); return true; }
    if ((a = t.closest('[data-ag-cc]'))) { ag.editCats[+a.getAttribute('data-ag-cc')].cor = a.getAttribute('data-v'); render(); return true; }
    if ((a = t.closest('[data-ag-cdel]'))) { ag.editCats.splice(+a.getAttribute('data-ag-cdel'), 1); render(); return true; }
    if (t.closest('[data-ag-cadd]')) { var used = ag.editCats.map(function (c) { return c.cor; }); ag.editCats.push({ nome: '', cor: COR_IDS.find(function (id) { return used.indexOf(id) < 0; }) || '8' }); render(); return true; }
    if (t.closest('[data-ag-ccancel]')) { ag.editCats = null; render(); return true; }
    if (t.closest('[data-ag-csave]')) { agSaveCats(); return true; }
    if (t.closest('[data-ag-back]')) { ag.confirm = false; render(); return true; }
    if (t.closest('[data-ag-cancel]')) { ag.form = null; ag.confirm = false; render(); return true; }
    if (t.closest('[data-ag-do]')) { agSave(); return true; }
    if (t.closest('[data-ag-allow]')) {
      // um clique = uma chamada; se der certo, o watch passa a receber também
      ag.error = null; render();
      agRefresh().then(function () { ag.key = null; agWatch(); render(); });
      return true;
    }
    return false;
  }
  function agSaveCats() {
    var list = ag.editCats.map(function (c) { return { nome: (c.nome || '').trim(), cor: c.cor }; }).filter(function (c) { return c.nome; });
    var seen = {};
    if (list.some(function (c) { var dup = seen[c.cor]; seen[c.cor] = 1; return dup; })) { ag.catsErr = 'Duas categorias com a mesma cor: no Google não daria para saber qual é qual.'; render(); return; }
    ag.catsErr = null;
    state.db.doc('config/agenda').set({ categorias: list }).then(function () { ag.editCats = null; }, function () {
      ag.catsErr = 'Não salvou. Só o dono do painel pode mudar as cores.';
    }).then(render);
  }
  // ag.week segue a convenção de weekRange: positivo = semanas para trás
  function agSyncWeek(d) {

    ag.week = Math.round((weekRange(0).start - mon) / (7 * 864e5));
  }

  // ---------- conteúdo: banco de fotos e vídeos + cronograma da Duda ----------
  // Os arquivos ficam no armazenamento do painel (assets); o índice fica no banco:
  // config/conteudo (pastas), midia/<id do arquivo> e cronograma/<id> (escrito pela Duda e pelo Rafa).
  var MAX_BYTES = 50 * 1024 * 1024;
  var PACIENTE = { nao: 'Sem paciente', autorizado: 'Paciente com autorização (TCLE)', sem_tcle: 'Paciente SEM autorização' };

  var ct = { assets: null, downloads: null, ready: false, view: 'hoje', pastas: null, midia: null, posts: null, pasta: '', usage: null,
    up: null, upErr: null, prog: null, sel: null, confirmDel: false, msg: null, newFolder: null, showOld: false,
    desafios: null, dsAdiantar: false, dsVer: null };

  function blobUrl(id) { return window.painelBlobUrl ? window.painelBlobUrl(id) : '/_blob/' + id; }
  function mb(n) { return (n / 1048576).toFixed(n < 10485760 ? 1 : 0) + ' MB'; }
  function pastaNome(id) { var p = (ct.pastas || []).find(function (x) { return x.id === id; }); return p ? p.nome : 'Sem pasta'; }
  function slug(s) { return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'pasta'; }

        return '<option value="' + esc(p.id) + '"' + (u.pasta === p.id ? ' selected' : '') + '>' + esc(p.nome) + '</option>'; }).join('') + '</select></label>' +
      '<label>Arquivos<input type="file" multiple accept="image/*,video/*" data-ct-file="1"></label></div>' +
      '<fieldset class="ct-radio"><legend>Aparece paciente (rosto, sorriso, nome, prontuário)?</legend>' +
      [['nao', 'Não'], ['autorizado', 'Sim, e ele assinou a autorização de uso de imagem'], ['sem_tcle', 'Sim, mas ainda sem autorização']].map(function (o) {
        return '<label><input type="radio" name="ct-pac" data-ct-f="paciente" value="' + o[0] + '"' + (u.paciente === o[0] ? ' checked' : '') + '> ' + o[1] + '</label>'; }).join('') + '</fieldset>' +
      '<label>O que é (opcional)<input type="text" maxlength="140" data-ct-f="nota" value="' + esc(u.nota || '') + '" placeholder="Ex.: resina no 11, antes e depois · sem nome de paciente"></label>' +

  var ED_ST = { pedida: 'Na fila do Rafa', editando: 'Rafa editando', pronta: 'Editado', falhou: 'A edição falhou' };

  // feedback da Duda: verde = está bom (pode ir para edição); vermelho = mudar antes
  function feedback(m) {
    var a = m.analise || {}, ed = m.edicao;
    if (!a.resumo) return '<div class="fb wait"><b>A Duda ainda vai analisar.</b> Ela olha os arquivos novos todo dia às 7h.</div>';
    var good = a.veredito !== 'mudar';
    var btn = '';
    if (m.tipo === 'video' && good) {
      if (ed) btn = '<p class="fb-ed">✂ ' + esc(ED_ST[ed.status] || ed.status) + ' · <button type="button" class="link-btn" data-goto="edicao">ver em Edição</button></p>';
      else if (m.paciente === 'sem_tcle') btn = '<p class="fb-ed">Sem autorização do paciente: não pode ir para edição.</p>';
      else btn = '<div class="acts"><button type="button" class="btn primary" data-ct-edit="' + esc(m.id) + '">Enviar para edição</button>' +

    }
    return '<div class="fb ' + (good ? 'good' : 'bad') + '"><b>' + (good ? '✓ Está bom' : '✕ Mudar antes de postar') + ' <span>· Duda</span></b>' +
      '<p>' + esc(a.resumo) + '</p>' +
      (a.pontos_fortes && a.pontos_fortes.length ? '<h4>O que funciona</h4>' + lista(a.pontos_fortes) : '') +
      (a.mudar && a.mudar.length ? '<h4>' + (good ? 'Dá para melhorar' : 'O que mudar') + '</h4>' + lista(a.mudar) : '') +

  function ctCrono() {
    var today = todayIso(), posts = (ct.posts || []).slice().sort(function (a, b) { return (a.data + (a.hora || '')).localeCompare(b.data + (b.hora || '')); });

  function dsFeitos() { return (ct.desafios && ct.desafios.feitos) || {}; }

  function dsSemana() {
    var d = new Date(), seg = new Date(d.getFullYear(), d.getMonth(), d.getDate() - (d.getDay() + 6) % 7), dias = [], f = dsFeitos();
    for (var i = 0; i < 7; i++) { var x = new Date(seg.getFullYear(), seg.getMonth(), seg.getDate() + i); dias.push(isoOf(x)); }

  }

    else delete f[n];
    ct.desafios = { inicio: cur.inicio || todayIso(), feitos: f };   // mostra já; o banco confirma em seguida
    render();
    return state.db.doc('config/desafios').set(ct.desafios).catch(function () { ct.msg = 'O desafio não foi salvo. Tente de novo.'; render(); });
  }

  // data em que a foto foi tirada (EXIF do JPEG); sem EXIF, a data do arquivo

        '<figure><figcaption>Depois' + (cd ? ' · ' + esc(fmtDay(cd.data || '')) : '') + '</figcaption>' + (cd ? '<img src="' + blobUrl(cd.asset) + '" alt="Depois">' : '<div class="pc-vazio">Sem foto de depois</div>') + '</figure></div>' : '') +

      ['antes', 'depois'].map(function (fase) {
        var l = fase === 'antes' ? a : d, sel = fase === 'antes' ? ca : cd;

  function pcSalvar(p, patch, erroMsg) {
    return state.db.doc('pacientes/' + p.id).update(patch).catch(function () { pc.msg = erroMsg || 'Não salvou. Tente de novo.'; render(); });
  }

  function pcSend() {
    var p = pcAtual(), u = pc.up; if (!p || !u) return;
    if (!u.files || !u.files.length) { u.err = 'Escolha as fotos.'; render(); return; }
    var files = Array.prototype.slice.call(u.files), novas = [], fails = 0;
    pc.prog = 'Lendo as datas das fotos…'; render();
    Promise.all(files.map(dataDaFoto)).then(function (datas) {
      // automático: as fotos do dia mais antigo são o antes; se todas forem do mesmo dia, comparam-se com as que o paciente já tem
      var menor = datas.slice().sort()[0], todasIguais = datas.every(function (d) { return d === menor; });
      var jaAntes = fotosDe(p, 'antes')[0];
      function fase(d) {
        if (u.fase !== 'auto') return u.fase;
        if (todasIguais) return jaAntes && jaAntes.data < d ? 'depois' : 'antes';
        return d === menor ? 'antes' : 'depois';
      }
      function next(i) {
        if (i >= files.length) {
          var ok = function () { pc.prog = null; pc.up = null; pc.cmp = { antes: null, depois: null };
            pc.msg = novas.length + (novas.length === 1 ? ' foto enviada' : ' fotos enviadas') + (fails ? '; ' + fails + ' não foram (formato não aceito ou falha na rede)' : '') + '.'; render(); };
          if (!novas.length) { ok(); return; }
          state.db.doc('pacientes/' + p.id).get().then(function (s) {
            var atuais = (s.exists && s.data().fotos) || [];
            return state.db.doc('pacientes/' + p.id).update({ fotos: atuais.concat(novas) });
          }).then(ok, function () { pc.prog = null; pc.msg = 'As fotos subiram, mas a ficha não salvou. Tente de novo.'; render(); });
          return;
        }
        pc.prog = 'Enviando ' + (i + 1) + ' de ' + files.length + '…'; render();
        prepImage(files[i]).then(function (b) { return ct.assets.upload(b, { type: 'image/jpeg', bucket: 'pacientes' }); }).then(function (r) {
          novas.push({ asset: r.id, fase: fase(datas[i]), data: datas[i], enviado: new Date().toISOString() });
        }, function () { fails++; }).then(function () { next(i + 1); });
      }
      next(0);
    });
  }

  function pcClick(t) {
    var a, p = pcAtual();
    if (t.closest('[data-pc-novo]')) { pc.novo = ''; pc.msg = null; render(); return; }
    if (t.closest('[data-pc-novocancel]')) { pc.novo = null; render(); return; }
    if (t.closest('[data-pc-criar]')) {
      var nome = (pc.novo || '').trim(); if (!nome) return;
      var id = pcId();
      state.db.doc('pacientes/' + id).set({ nome: nome, busca: semAcento(nome), criado: new Date().toISOString(), divulgacao: 'nao', obs: '', fotos: [] })
        .then(function () { pc.novo = null; pc.sel = id; pc.up = { fase: 'auto', files: null }; }, function () { pc.msg = 'A ficha não foi criada. Tente de novo.'; }).then(render);
      return;
    }
    if ((a = t.closest('[data-pc-sel]'))) { pc.sel = a.getAttribute('data-pc-sel'); pc.foto = null; pc.up = null; pc.msg = null; pc.confirmDel = false; pc.cmp = { antes: null, depois: null }; pc.ret = { motivo: '', data: '' }; pc.verFeitos = false; render(); window.scrollTo(0, 0); return; }
    if (t.closest('[data-pc-voltar]')) { pc.sel = null; pc.foto = null; pc.up = null; pc.msg = null; pc.editNome = null; render(); return; }
    // retorno feito: funciona na lista geral e na ficha
    if ((a = t.closest('[data-pc-retok]'))) {
      var par = a.getAttribute('data-pc-retok').split('|'), pr = (pc.lista || []).find(function (x) { return x.id === par[0]; }); if (!pr) return;
      a.disabled = true;
      pcSalvar(pr, { retornos: (pr.retornos || []).map(function (r) { return r.id === par[1] ? Object.assign({}, r, { feito: new Date().toISOString() }) : r; }) });
      return;
    }
    if (!p) return;
    if ((a = t.closest('[data-pc-retmes]'))) { pc.ret.data = maisMeses(+a.getAttribute('data-pc-retmes')); render(); return; }
    if (t.closest('[data-pc-retfeitos]')) { pc.verFeitos = !pc.verFeitos; render(); return; }
    if (t.closest('[data-pc-retadd]')) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(pc.ret.data)) { pc.msg = 'Escolha a data do retorno.'; render(); return; }
      var novo = { id: pcId(), data: pc.ret.data, motivo: (pc.ret.motivo || '').trim() || 'Retorno', feito: null };
      pc.msg = null;
      pcSalvar(p, { retornos: (p.retornos || []).concat([novo]) }, 'O retorno não foi salvo. Tente de novo.').then(function () { if (!pc.msg) { pc.ret = { motivo: '', data: '' }; render(); } });
      return;
    }
    if ((a = t.closest('[data-pc-retdel]'))) {
      var rid = a.getAttribute('data-pc-retdel');
      pcSalvar(p, { retornos: (p.retornos || []).filter(function (r) { return r.id !== rid; }) });
      return;
    }
    if (t.closest('[data-pc-up]')) { pc.up = { fase: 'auto', files: null }; pc.msg = null; render(); return; }
    if (t.closest('[data-pc-upcancel]')) { pc.up = null; render(); return; }
    if (t.closest('[data-pc-send]')) { pcSend(); return; }
    if ((a = t.closest('[data-pc-foto]'))) {
      var as = a.getAttribute('data-pc-foto'), f = (p.fotos || []).find(function (x) { return x.asset === as; }); if (!f) return;
      if (pc.cmp[f.fase] === as || (!pc.cmp[f.fase] && a.classList.contains('on'))) pc.foto = as; else pc.cmp[f.fase] = as;
      pc.confirmDel = false; render(); return;
    }
    if (t.closest('[data-pc-fotofecha]')) { pc.foto = null; pc.confirmDel = false; render(); return; }
    if ((a = t.closest('[data-pc-fase]'))) {
      var nf = a.getAttribute('data-pc-fase');
      pcSalvar(p, { fotos: (p.fotos || []).map(function (x) { return x.asset === pc.foto ? Object.assign({}, x, { fase: nf }) : x; }) });
      pc.cmp = { antes: null, depois: null }; return;
    }
    if (t.closest('[data-pc-fotodel]')) { pc.confirmDel = 'foto'; render(); return; }
    if (t.closest('[data-pc-pacdel]')) { pc.confirmDel = 'pac'; render(); return; }
    if (t.closest('[data-pc-delno]')) { pc.confirmDel = false; render(); return; }
    if (t.closest('[data-pc-fotodelok]')) {
      var alvo = pc.foto;
      ct.assets.delete(alvo, { bucket: 'pacientes' }).then(function () {
        return state.db.doc('pacientes/' + p.id).update({ fotos: (p.fotos || []).filter(function (x) { return x.asset !== alvo; }) });
      }).then(function () { pc.foto = null; pc.confirmDel = false; pc.cmp = { antes: null, depois: null }; }, function () { pc.msg = 'Não deu para apagar agora.'; pc.foto = null; }).then(render);
      return;
    }
    if (t.closest('[data-pc-pacdelok]')) {
      Promise.all((p.fotos || []).map(function (x) { return ct.assets.delete(x.asset, { bucket: 'pacientes' }).catch(function () {}); }))
        .then(function () { return state.db.doc('pacientes/' + p.id).delete(); })
        .then(function () { pc.sel = null; pc.confirmDel = false; pc.msg = 'Paciente apagado.'; }, function () { pc.msg = 'Não deu para apagar agora.'; }).then(render);
      return;
    }
    if (t.closest('[data-pc-nome]')) { pc.editNome = p.nome; render(); return; }
    if (t.closest('[data-pc-nomeno]')) { pc.editNome = null; render(); return; }
    if (t.closest('[data-pc-nomeok]')) {
      var nn = (pc.editNome || '').trim(); if (!nn) return;
      pcSalvar(p, { nome: nn, busca: semAcento(nn) }); pc.editNome = null; return;
    }
    if ((a = t.closest('[data-pc-obs]'))) {
      var tx = main.querySelector('[data-pc-f="obs"]'), tel = main.querySelector('[data-pc-f="tel"]');
      pcSalvar(p, { obs: tx ? tx.value : '', telefone: tel ? tel.value.trim() : (p.telefone || '') }).then(function () { a.textContent = 'Salvo ✓'; });
      return;
    }
  }

  function mark(dayId, optId, value) {
    if (!state.db) return;
    var day = state.days.find(function (d) { return d.id === dayId; }); if (!day) return;
    var cur = (day.estado || {})[optId];
    var next = cur === value ? '' : value;
    var key = dayId + ':' + optId;
    state.saving[key] = true; render();
    var patch = {}; patch[optId] = next || { __delete__: true };
    var write = next ? state.db.doc('marketing/' + dayId).update({ estado: patch })
      : state.db.doc('marketing/' + dayId).get().then(function (snap) {
          var est = Object.assign({}, (snap.data() || {}).estado || {}); delete est[optId];
          var body = Object.assign({}, snap.data() || {}); body.estado = est;
          return state.db.doc('marketing/' + dayId).set(body);
        });
    write.catch(function (err) {
      state.error = err && err.code === 'invalid_argument' ? 'Só o dono do painel pode marcar opções.' : 'A marcação não foi salva. Tente de novo.';
    }).then(function () { delete state.saving[key]; render(); });
  }

  if (window.claude && window.claude.use) {
