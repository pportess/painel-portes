<style>
#ponte-login { position: fixed; inset: 0; z-index: 1000; background: #ffffff; display: grid; place-items: center; padding: 16px; font-family: "Manrope", "Segoe UI", system-ui, sans-serif; color: #121214; }
#ponte-login .pl-card { width: min(380px, 100%); display: grid; gap: 14px; }
#ponte-login .pl-marca { font-weight: 800; font-size: 15px; color: #5f9483; }
#ponte-login h1 { font-size: 24px; margin: 0; }
#ponte-login p { margin: 0; color: #76736c; line-height: 1.5; }
#ponte-login form { display: grid; gap: 10px; }
#ponte-login input { font: inherit; padding: 12px 14px; border: 1px solid #ececee; border-radius: 12px; background: #f4f4f5; }
#ponte-login button { font: inherit; font-weight: 700; padding: 12px 14px; border: 0; border-radius: 12px; background: #5f9483; color: #fff; cursor: pointer; }
#ponte-login button:disabled { opacity: .6; }
#ponte-login .pl-sec { background: #f4f4f5; color: #121214; }
#ponte-login .pl-msg { color: #c25d41; }
#ponte-login .pl-ok { color: #5f9483; }
#ponte-login label { display: grid; gap: 4px; font-size: 13px; font-weight: 600; color: #76736c; }
#ponte-login .pl-links { font-size: 14px; }
#ponte-login a, #ponte-acessos a { color: #5f9483; font-weight: 700; }
#ponte-barra { position: fixed; z-index: 900; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)); display: flex; gap: 6px; font-family: "Manrope", "Segoe UI", system-ui, sans-serif; }
#ponte-barra button { font: inherit; font-size: 13px; font-weight: 700; padding: 8px 12px; border: 1px solid #ececee; border-radius: 999px; background: #fff; color: #121214; cursor: pointer; box-shadow: 0 2px 10px rgba(0,0,0,.08); display: flex; align-items: center; gap: 6px; }
#ponte-barra span { background: #c25d41; color: #fff; border-radius: 999px; min-width: 18px; padding: 0 5px; font-size: 11px; line-height: 18px; text-align: center; }
#ponte-acessos { position: fixed; inset: 0; z-index: 1000; background: rgba(18,18,20,.35); display: grid; place-items: center; padding: 16px; font-family: "Manrope", "Segoe UI", system-ui, sans-serif; color: #121214; }
#ponte-acessos .pl-card { width: min(560px, 100%); max-height: calc(100vh - 32px); overflow: auto; background: #fff; border-radius: 16px; padding: 20px; display: grid; gap: 12px; }
#ponte-acessos .pl-topo { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
#ponte-acessos h1 { font-size: 22px; margin: 0; }
#ponte-acessos p { margin: 0; color: #76736c; line-height: 1.5; }
#ponte-acessos ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
#ponte-acessos li { border: 1px solid #ececee; border-radius: 12px; padding: 12px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; }
#ponte-acessos li small { color: #76736c; overflow-wrap: anywhere; }
#ponte-acessos .pl-bts { display: flex; gap: 6px; }
#ponte-acessos button { font: inherit; font-size: 13px; font-weight: 700; padding: 8px 12px; border: 0; border-radius: 10px; background: #5f9483; color: #fff; cursor: pointer; }
#ponte-acessos button.pl-sec { background: #f4f4f5; color: #121214; }
#ponte-acessos .pl-msg { color: #c25d41; }
#ponte-acessos .pl-st { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: #f4f4f5; color: #76736c; }
#ponte-acessos .pl-pendente { background: #f1dcc4; color: #8a5a1c; }
#ponte-acessos .pl-aprovado { background: #d7efe6; color: #3f6f60; }

<body>
<title>Painel do Consultório</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra lateral escura com o item escolhido em branco, fundo claro (pedido do Pedro, 04/11/2026; antes era branco com seção verde). */
:root, :root[data-theme="dark"] {
  color-scheme: light;
  --bg: #f5f7fb;
  --panel: #ffffff;
  --field: #f4f4f5;
  --fg: #121214;
  --muted: #76736c;
  --line: #ececee;
  --ink: #111113;
  --on-ink: #ffffff;
  --accent: #5f9483;
  --accent-soft: #d7efe6;
  --peach: #f1dcc4;
  --bad: #c25d41;
  --strong: #5f9483;
  --mid: #b98a3e;
  --weak: #8c8f97;
  --font-ui: "Manrope", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --radius: 14px;
  --side: #0e1322;
  --mapa: #eef1f6;
  --vermelho: #d63031;
  --laranja: #ee8a2c;
  --verde: #29b36b;
  --soft: 0 1px 2px rgba(23,37,60,.05), 0 4px 14px rgba(23,37,60,.05);
}
html, body { height: 100%; background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 15px; line-height: 1.5; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }

.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100%; }

/* barra lateral */
.side { background: var(--side); color: #fff; border-right: 0; display: flex; flex-direction: column; gap: 24px;
  padding-block: 24px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: 18px;
  position: sticky; top: 0; height: 100vh; }
.brand { display: flex; flex-direction: column; gap: 2px; padding-inline: 8px; }
.brand b { font-size: 17px; font-weight: 800; letter-spacing: -0.01em; }
.brand span { font-size: 12px; opacity: .6; }
.nav { display: flex; flex-direction: column; gap: 2px; list-style: none; margin: 0; padding: 0; }
.nav button { width: 100%; display: flex; align-items: center; gap: 10px; text-align: left;
  border: 0; background: transparent; color: #fff; padding: 10px 12px; border-radius: 999px; opacity: .72;
  transition: background .15s ease, color .15s ease; }
.nav button:hover { opacity: 1; background: rgba(255,255,255,.08); }
.nav button[aria-current="page"] { opacity: 1; background: #fff; color: #0e1322; font-weight: 700; }
.nav .ic { width: 20px; height: 20px; flex: none; }
.nav .soon { margin-left: auto; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; opacity: .55; }
.side-foot { margin-top: auto; font-size: 12px; opacity: .55; padding-inline: 8px; }

/* área principal */
.main { min-width: 0; padding-block: 32px 48px; padding-left: max(16px, 4vw); padding-right: max(16px, env(safe-area-inset-right, 0px), 4vw); }
.page-head { display: flex; flex-direction: column; gap: 6px; margin-bottom: 24px; max-width: 70ch; }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.page-head h1 { font-size: clamp(24px, 3vw, 32px); font-weight: 800; letter-spacing: -0.02em; }
.page-head p { margin: 0; color: var(--muted); }

/* página Agentes: estrutura pedida pelo Pedro em 04/11/2026 */
.ag-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
.ag-head h1 { font-size: 30px; font-weight: 600; letter-spacing: -.02em; }
.ag-head p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.ag-right { display: grid; justify-items: end; gap: 6px; }
.ag-right small { color: var(--muted); font-size: 12px; }
.ag-stats { display: flex; gap: 8px; }
.ag-stats div { background: var(--panel); border-radius: 12px; padding: 8px 16px; min-width: 96px; box-shadow: var(--soft); }
.ag-stats b { display: block; font-size: 20px; font-weight: 700; color: var(--vermelho); line-height: 1.2; }
.ag-stats div:nth-child(2) b { color: var(--fg); }
.ag-stats span { font-size: 11px; color: var(--muted); }
.ag-h2 { font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
.ag-p { margin: 2px 0 14px; font-size: 13px; color: var(--muted); }
.ag-setores { margin: 34px 0 14px; }
.ag-grid { display: grid; grid-template-columns: minmax(0, 1.12fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.ag-mapa { position: relative; border-radius: 18px; overflow: hidden; background: var(--mapa); box-shadow: var(--soft); }
.ag-mapa img { display: block; width: 100%; height: auto; }
.ag-mapa svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.sala { fill: transparent; cursor: pointer; mix-blend-mode: multiply; transition: fill .15s ease; }
.sala.n-foco { fill: rgba(214, 48, 49, .34); }
.sala.n-atencao { fill: rgba(240, 140, 40, .24); }
.sala:hover { fill: rgba(60, 90, 160, .22); }
.sala-tag { position: absolute; transform: translate(-50%, -50%); display: inline-flex; align-items: center; gap: 6px; border: 0; white-space: nowrap;
  font: 700 11px/1.2 var(--font-ui); padding: 4px 9px; border-radius: 999px; background: rgba(23, 37, 60, .9); color: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.22); }
.sala-tag b { font-weight: 800; opacity: .9; }
.sala-tag.n-foco { background: var(--vermelho); }
.sala-tag.n-atencao { background: var(--laranja); }
.sala-tag.n-parado { background: rgba(90, 98, 112, .85); }
.sg-cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.sg-card { display: grid; gap: 6px; text-align: left; border: 0; border-left: 3px solid var(--verde); border-radius: 14px; padding: 12px 14px; background: var(--panel); box-shadow: var(--soft); min-width: 0; align-content: start; }
.sg-card:hover { box-shadow: 0 6px 20px rgba(23, 37, 60, .12); }
.sg-card.n-foco { border-left-color: var(--vermelho); }
.sg-card.n-atencao { border-left-color: var(--laranja); }
.sg-card.n-parado { border-left-color: #c4c9d2; }
.sg-foco { justify-self: start; background: var(--vermelho); color: #fff; font-size: 10px; font-weight: 800; padding: 2px 9px; border-radius: 999px; }
.sg-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.sg-top b { font-size: 14px; font-weight: 600; min-width: 0; }
.sg-top em { font-style: normal; font-size: 22px; font-weight: 500; line-height: 1; color: var(--verde); }
.n-foco .sg-top em { color: var(--vermelho); }
.n-atencao .sg-top em { color: var(--laranja); }
.n-parado .sg-top em { color: #aab0ba; }
.sg-linha { display: block; height: 3px; border-radius: 9px; background: var(--field); overflow: hidden; }
.sg-linha i { display: block; height: 100%; background: var(--verde); }
.n-foco .sg-linha i { background: var(--vermelho); }
.n-atencao .sg-linha i { background: var(--laranja); }
.sg-sub { font-size: 11.5px; color: var(--muted); }
.sg-bar { display: flex; gap: 2px; height: 6px; border-radius: 9px; overflow: hidden; }
.sg-bar i { display: block; min-width: 6px; }
.sg-bar .late { background: var(--vermelho); }
.sg-bar .voce { background: #1d3f8f; }
.sg-bar .andando { background: #6f8fd8; }
.sg-bar .fila { background: #c3c8ee; }
.sg-bar .feita { background: var(--verde); }
.sg-bar .vazio { background: var(--field); }
.sg-pe { display: flex; justify-content: space-between; gap: 8px; align-items: center; font-size: 11px; color: var(--muted); }
.sg-dots { display: flex; gap: 3px; }
.sg-dots i, .tf-av i { width: 8px; height: 8px; border-radius: 50%; display: block; background: #c4c9d2; }
.sg-dots i.d-ok, .tf-av i.d-ok { background: var(--verde); }
.sg-dots i.d-late, .tf-av i.d-late { background: var(--vermelho); }
.sg-dots i.d-sem, .tf-av i.d-sem { background: var(--laranja); }
.st-grid { columns: 3 300px; column-gap: 14px; }
.st-col { break-inside: avoid; margin-bottom: 14px; background: var(--panel); border-radius: 16px; padding: 16px 18px; box-shadow: var(--soft); scroll-margin-top: 90px; }
.st-col.marcado { outline: 2px solid #1d3f8f; }
.st-col header { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.st-col h3 { font-size: 17px; font-weight: 600; }
.st-status { font-size: 12px; font-weight: 700; color: var(--verde); white-space: nowrap; }
.st-status.n-foco { color: var(--vermelho); }
.st-status.n-atencao { color: #d9761a; }
.st-status.n-parado { color: #8a909b; }
.st-sub { margin: 0 0 6px; font-size: 12px; color: var(--muted); }
.tf { display: flex; gap: 12px; width: 100%; text-align: left; border: 0; border-top: 1px solid var(--line); background: transparent; padding: 12px 0; font: inherit; }
.st-sub + .tf { border-top: 0; }
.tf:hover b { text-decoration: underline; }
.tf-av { position: relative; flex: none; width: 42px; height: 42px; }
.tf-av svg { width: 42px; height: 42px; display: block; }
.tf-av i { position: absolute; right: 1px; top: 1px; box-shadow: 0 0 0 2px var(--panel); }
.tf-tx { display: grid; gap: 2px; min-width: 0; font-size: 13px; color: #4f545e; }
.tf-tx b { font-size: 14.5px; font-weight: 600; color: var(--fg); }
.tf-tx small { font-size: 11.5px; color: #8a909b; overflow-wrap: anywhere; }
.tf-tp { margin: 2px 0 2px; padding-left: 16px; display: grid; gap: 4px; }
.tf-tp li { display: grid; gap: 0; }
.tf-tp li span { color: var(--fg); font-weight: 500; }
.tf-tp li small { font-size: 11.5px; color: #8a909b; }
.st-vaga { margin: 8px 0 0; font-size: 13px; color: var(--muted); }
.st-mais { border: 0; background: transparent; padding: 8px 0 0; font: inherit; font-size: 13px; font-weight: 600; color: var(--fg); }
.st-ab { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 4px; }
.st-ab button { width: 100%; text-align: left; border: 0; border-left: 3px solid #c3c8ee; border-radius: 6px; background: var(--field); padding: 6px 10px; font: inherit; font-size: 13px; }
.st-ab .t-voce button { border-left-color: #1d3f8f; }
.st-ab .t-atrasada button { border-left-color: var(--vermelho); }
.st-ab .t-andando button { border-left-color: #6f8fd8; }
.ag-nota { margin: 18px 0 0; font-size: 12px; color: #8a909b; max-width: 80ch; }
.face svg { width: 100%; height: 100%; display: block; }
@media (max-width: 1080px) { .ag-grid { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 720px) {
  .sg-cards { grid-template-columns: minmax(0, 1fr); }
  .ag-right { justify-items: start; width: 100%; }
  .ag-stats { width: 100%; }
  .ag-stats div { flex: 1; min-width: 0; padding: 8px 10px; }
  .sala-tag { font-size: 9px; padding: 2px 6px; gap: 3px; }
  .sala-tag span { max-width: 74px; overflow: hidden; text-overflow: ellipsis; }
}

.face { width: 108px; height: 108px; border-radius: 50%; background: #fff; display: grid; place-items: center; overflow: hidden; flex: none;
  box-shadow: 0 0 0 10px #f4f4f2, 0 0 0 11px var(--line); margin-top: 10px; }
.face img { width: 100%; height: 100%; display: block; }
.face b { font-size: 36px; font-weight: 800; color: var(--muted); }
.face.empty-face { color: #c9c7c1; box-shadow: 0 0 0 10px #f8f8f6; }
.face.big { width: 120px; height: 120px; }
.face.sm { width: 48px; height: 48px; margin-top: 0; box-shadow: 0 0 0 4px #f4f4f2, 0 0 0 5px var(--line); }
.face.sm b { font-size: 18px; }
.face.sm.empty-face { box-shadow: 0 0 0 4px #f8f8f6; }
.agent-hero { margin: 4px 0 18px 10px; }


/* detalhe do agente */
.back { border: 0; background: transparent; color: var(--muted); padding: 0; margin-bottom: 12px; font-weight: 600; }
.back:hover { color: var(--fg); }
.detail { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 24px; align-items: start; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; }
.role h2 { font-size: 15px; font-weight: 800; margin-bottom: 8px; }
.role p, .role li { font-size: 14px; color: var(--muted); }
.role ul { padding-left: 18px; margin: 8px 0 0; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 0; }
.chip { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--field); color: var(--fg); }
.chip.ok { background: var(--accent-soft); }

.day-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
.day-head h2 { font-size: 20px; font-weight: 800; letter-spacing: -0.01em; }
.date { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.focus { margin: 4px 0 16px; padding: 12px 14px; border-radius: 10px; background: var(--peach); font-size: 14px; }
.focus b { font-weight: 700; }

.options { display: flex; flex-direction: column; gap: 12px; }
.opt { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px;
  display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.opt.done { opacity: .55; }
.opt-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.force { font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; border: 1.5px solid currentColor; }
.force.forte { color: var(--strong); }
.force.medio { color: var(--mid); }
.force.fraco { color: var(--weak); }
.kind { font-size: 12px; color: var(--muted); font-weight: 600; }
.time { font-family: var(--font-mono); font-size: 12px; color: var(--muted); margin-left: auto; }
.opt h3 { font-size: 16px; font-weight: 800; }
.hook { font-size: 15px; margin: 0; padding-left: 12px; border-left: 3px solid var(--accent); }
.opt dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 12px; margin: 0; font-size: 14px; }
.opt dt { color: var(--muted); font-weight: 600; }
.opt dd { margin: 0; }
.src { font-family: var(--font-mono); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.acts { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--field); padding: 7px 14px; border-radius: 999px; font-size: 13px; font-weight: 700; }
.btn.primary { background: var(--fg); color: var(--bg); border-color: transparent; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }

.history h2 { font-size: 15px; font-weight: 800; margin-bottom: 10px; }
.history ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.history button { width: 100%; border: 0; background: transparent; text-align: left; padding: 8px 10px; border-radius: 8px;
  display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
.history button:hover { background: var(--field); }
.history button[aria-current="true"] { background: var(--accent-soft); font-weight: 700; }
.history .n { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }

/* agenda: semana do Google Agenda, horários livres para particular e o formulário de consulta */
.ag-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 14px; }
.ag-bar .week-nav { margin-right: auto; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--field); }
.seg button { border: 0; background: transparent; padding: 5px 14px; border-radius: 999px; font-size: 13px; font-weight: 700; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.ag-status { font-size: 12px; color: var(--muted); margin: 0 0 12px; }
.ag-warn { border: 1px solid #ecd9b8; background: #fbf4e6; border-radius: 10px; padding: 10px 14px; font-size: 13px; margin-bottom: 14px; }
.ag-warn .btn { margin-top: 8px; }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }

  // horário livre = janela do dia menos os eventos que caem nela (sobras de 1h ou mais)

  // eventos que se cruzam dividem a largura da coluna (como no Google)

  // semana (7 colunas) ou dia (1 coluna): grade de horários com as barras dos eventos

  function monthView(evs) {

  function renderAgenda() {

    var title = ag.view === 'dia' ? fmtDay(ag.day) : ag.view === 'mes' ? MES_LONGO[ag.month.getMonth()] + ' ' + ag.month.getFullYear() : shortDay(w.start) + ' – ' + shortDay(w.end);

      '<button type="button" data-ag-step="1" aria-label="Seguinte">›</button><button type="button" class="btn" data-ag-today="1" style="width:auto;border-radius:999px;padding:4px 12px">Hoje</button></div>' +

    if (!ag.mcp) return head + '<div class="empty"><b>A agenda ainda não está ligada neste site.</b> Por enquanto, use a Agenda pelo painel no claude.ai. A ligação com o Google é a próxima etapa.</div>';
    var status = '';

    else if (ag.view === 'dia') { var p = ag.day.split('-'); body = timeGrid([new Date(+p[0], +p[1] - 1, +p[2])], ag.events); }
    else {

  function agSave() {
    var f = ag.form; if (!f || ag.busy) return;
    var end = addMin(f.date, f.time, +f.dur);
    var call = f.mode === 'move'
      ? ag.mcp.callTool(GCAL, 'update_event', Object.assign({ eventId: f.id, startTime: localStamp(f.date, f.time), endTime: localStamp(end.date, end.time) }, f.color && f.color !== f.color0 ? { colorId: f.color } : {}))
      : ag.mcp.callTool(GCAL, 'create_event', Object.assign({ summary: f.title.trim(), startTime: localStamp(f.date, f.time), endTime: localStamp(end.date, end.time) }, f.place ? { location: f.place } : {}, f.color ? { colorId: f.color } : {}));
    ag.busy = true; render();
    call.then(function () {
      ag.msg = f.mode === 'move' ? 'Mudado no Google Agenda.' : 'Evento criado no Google Agenda.';
      ag.form = null; ag.confirm = false;
    }, function (e) {
      // gravação com resposta ambígua: pode ter ido; nada de repetir sozinho
      ag.msg = /server_unavailable|upstream_error|cancelled/.test(e && e.code)
        ? 'O Google Agenda não confirmou a gravação. Pode ter ido: confira a semana antes de tentar de novo.'
        : agErrorText(e);
      ag.confirm = false;
    }).then(function () { ag.busy = false; return agRefresh(); }).then(render);
  }

  function agClick(t) {
    var a;
    if ((a = t.closest('[data-ag-step]'))) {
      var s = +a.getAttribute('data-ag-step');
      if (ag.view === 'dia') { var p = ag.day.split('-'); var d = new Date(+p[0], +p[1] - 1, +p[2] + s); ag.day = isoOf(d); agSyncWeek(d); }
      else if (ag.view === 'mes') ag.month = new Date(ag.month.getFullYear(), ag.month.getMonth() + s, 1);
      else ag.week = ag.week - s;
      agWatch(); render(); return true;
    }
    if (t.closest('[data-ag-today]')) { var n0 = new Date(); ag.week = 0; ag.day = todayIso(); ag.month = new Date(n0.getFullYear(), n0.getMonth(), 1); agWatch(); render(); return true; }
    if ((a = t.closest('[data-ag-view]'))) {
      var v = a.getAttribute('data-ag-view'), base;
      // dia de referência da visão atual, para a nova visão abrir no mesmo lugar
      if (ag.view === 'dia') base = new Date(ag.day + 'T12:00:00');
      else if (ag.view === 'mes') { var n1 = new Date(); base = n1.getMonth() === ag.month.getMonth() && n1.getFullYear() === ag.month.getFullYear() ? n1 : new Date(ag.month); }
      else base = ag.week === 0 ? new Date() : weekRange(ag.week).start;
      ag.view = v; ag.day = isoOf(base); agSyncWeek(base); ag.month = new Date(base.getFullYear(), base.getMonth(), 1);
      agWatch(); render(); return true;
    }
    if ((a = t.closest('[data-ag-goday]'))) {
      ag.view = 'dia'; ag.day = a.getAttribute('data-ag-goday'); agSyncWeek(new Date(ag.day + 'T12:00:00'));
      agWatch(); render(); window.scrollTo(0, 0); return true;
    }
    if ((a = t.closest('[data-ag-new]'))) {
      ag.form = { mode: 'new', date: a.getAttribute('data-ag-new'), time: a.getAttribute('data-ag-time') || '14:00', dur: 60, title: '', place: '', color: '' };
      var day = new Date(ag.form.date + 'T12:00:00'), fw = FREE[day.getDay()];
      if (a.classList.contains('free') && fw) {
        ag.form.place = fw.place;
        var pc = (ag.cats || []).find(function (c) { return /paciente/i.test(c.nome); }); if (pc) ag.form.color = pc.cor;
      }
      ag.confirm = false; ag.formErr = null; ag.msg = null; render(); window.scrollTo(0, 0); return true;
    }
    if ((a = t.closest('[data-ag-move]'))) {
      var e = (ag.events || []).find(function (x) { return x.id === a.getAttribute('data-ag-move'); }); if (!e) return true;
      var s0 = evStart(e), e0 = evEnd(e);
      ag.form = { mode: 'move', id: e.id, title: e.summary || '(sem título)', date: isoOf(s0), time: hm(s0), dur: Math.round((e0 - s0) / 60000),
        was: fmtDay(isoOf(s0)) + ', ' + hm(s0) + '–' + hm(e0), color: e.colorId || '', color0: e.colorId || '',
        link: e.htmlLink && /^https:\/\/www\.google\.com\//.test(e.htmlLink) ? e.htmlLink : '' };
      ag.confirm = false; ag.formErr = null; ag.msg = null; render(); window.scrollTo(0, 0); return true;
    }
    if ((a = t.closest('[data-ag-cat]'))) { var c0 = (ag.cats || [])[+a.getAttribute('data-ag-cat')]; if (c0 && ag.form) ag.form.color = c0.cor; render(); return true; }
    if ((a = t.closest('[data-ag-color]'))) { if (ag.form) ag.form.color = a.getAttribute('data-ag-color'); render(); return true; }
    if (t.closest('[data-ag-review]')) {
      var f = ag.form;
      ag.formErr = !f.date || !f.time ? 'Escolha o dia e o horário.' : f.mode === 'new' && !(f.title || '').trim() ? 'Escreva um título.' : null;
      ag.confirm = !ag.formErr; render(); return true;
    }
    // editor de categorias
    if (t.closest('[data-ag-cedit]')) { ag.editCats = (ag.cats || []).map(function (c) { return { nome: c.nome, cor: c.cor }; }); ag.catsErr = null; render(); return true; }
    if ((a = t.closest('[data-ag-cc]'))) { ag.editCats[+a.getAttribute('data-ag-cc')].cor = a.getAttribute('data-v'); render(); return true; }
    if ((a = t.closest('[data-ag-cdel]'))) { ag.editCats.splice(+a.getAttribute('data-ag-cdel'), 1); render(); return true; }
    if (t.closest('[data-ag-cadd]')) { var used = ag.editCats.map(function (c) { return c.cor; }); ag.editCats.push({ nome: '', cor: COR_IDS.find(function (id) { return used.indexOf(id) < 0; }) || '8' }); render(); return true; }
    if (t.closest('[data-ag-ccancel]')) { ag.editCats = null; render(); return true; }
    if (t.closest('[data-ag-csave]')) { agSaveCats(); return true; }
    if (t.closest('[data-ag-back]')) { ag.confirm = false; render(); return true; }
    if (t.closest('[data-ag-cancel]')) { ag.form = null; ag.confirm = false; render(); return true; }
    if (t.closest('[data-ag-do]')) { agSave(); return true; }
    if (t.closest('[data-ag-allow]')) {
      // um clique = uma chamada; se der certo, o watch passa a receber também
      ag.error = null; render();
      agRefresh().then(function () { ag.key = null; agWatch(); render(); });
      return true;
    }
    return false;
  }
  function agSaveCats() {
    var list = ag.editCats.map(function (c) { return { nome: (c.nome || '').trim(), cor: c.cor }; }).filter(function (c) { return c.nome; });
    var seen = {};

    ag.catsErr = null;

  // ---------- conteúdo: banco de fotos e vídeos + cronograma da Duda ----------

  var ED_ST = { pedida: 'Na fila do Rafa', editando: 'Rafa editando', pronta: 'Editado', falhou: 'A edição falhou' };
  function lista(arr) { return arr && arr.length ? '<ul>' + arr.map(function (i) { return '<li>' + esc(i) + '</li>'; }).join('') + '</ul>' : ''; }

  // feedback da Duda: verde = está bom (pode ir para edição); vermelho = mudar antes
  function feedback(m) {
    var a = m.analise || {}, ed = m.edicao;
    if (!a.resumo) return '<div class="fb wait"><b>A Duda ainda vai analisar.</b> Ela olha os arquivos novos todo dia às 7h.</div>';
    var good = a.veredito !== 'mudar';
    var btn = '';
    if (m.tipo === 'video' && good) {
      if (ed) btn = '<p class="fb-ed">✂ ' + esc(ED_ST[ed.status] || ed.status) + ' · <button type="button" class="link-btn" data-goto="edicao">ver em Edição</button></p>';
      else if (m.paciente === 'sem_tcle') btn = '<p class="fb-ed">Sem autorização do paciente: não pode ir para edição.</p>';
      else btn = '<div class="acts"><button type="button" class="btn primary" data-ct-edit="' + esc(m.id) + '">Enviar para edição</button>' +
        '<span class="hint">' + esc((a.edicao_sugerida && a.edicao_sugerida.pedido) || 'O Rafa faz o corte vertical com gancho e assinatura.') + '</span></div>';
    }
    return '<div class="fb ' + (good ? 'good' : 'bad') + '"><b>' + (good ? '✓ Está bom' : '✕ Mudar antes de postar') + ' <span>· Duda</span></b>' +
      '<p>' + esc(a.resumo) + '</p>' +
      (a.pontos_fortes && a.pontos_fortes.length ? '<h4>O que funciona</h4>' + lista(a.pontos_fortes) : '') +
      (a.mudar && a.mudar.length ? '<h4>' + (good ? 'Dá para melhorar' : 'O que mudar') + '</h4>' + lista(a.mudar) : '') +
      (a.cuidado ? '<p class="fb-care">⚠ ' + esc(a.cuidado) + '</p>' : '') +
      (a.ideias && a.ideias.length ? '<h4>Como usar</h4>' + lista(a.ideias) : '') + btn + '</div>';
  }

  function ctDetail(m) {
    return '<button type="button" class="back" data-ct-close="1">← ' + esc(pastaNome(m.pasta)) + '</button>' +
      '<div class="ct-detail"><div class="ct-big">' + (m.tipo === 'video' ? '<video src="' + blobUrl(m.asset) + '" controls playsinline preload="metadata"></video>' : '<img src="' + blobUrl(m.asset) + '" alt="">') + '</div>' +
      '<div class="ct-info"><h2>' + esc(m.nota || (m.tipo === 'video' ? 'Vídeo' : 'Foto')) + '</h2>' +
      '<p class="hint">' + esc(fmtDay((m.criado || '').slice(0, 10))) + ' · ' + mb(m.tamanho || 0) + ' · ' + esc(MIDIA_ST[m.status] || m.status || '') + '</p>' +

      '<details class="ct-more"><summary>Pasta, paciente e apagar</summary>' +
      '<label>Pasta<select data-ct-move="' + esc(m.id) + '">' + (ct.pastas || []).map(function (p) {

      '<label>Paciente<select data-ct-pac="' + esc(m.id) + '">' + Object.keys(PACIENTE).map(function (k) {

      '<div class="acts">' + (ct.confirmDel ? '<span class="hint bad">Apagar de vez este arquivo?</span><button type="button" class="btn" data-ct-delyes="1">Sim, apagar</button><button type="button" class="btn" data-ct-delno="1">Não</button>'
        : '<button type="button" class="btn" data-ct-del="1">Apagar</button>') + '</div></details></div></div>';

  function card(m) {
    var a = m.analise || {}, fb = !a.resumo ? '' : a.veredito === 'mudar' ? '<span class="warn">mudar</span>' : '<span class="ok">✓ bom</span>';

      '<span class="ct-cap">' + esc(m.nota || pastaNome(m.pasta)) + '</span></button>';

  // início: uma pasta por quadrado; dentro da pasta, os arquivos; dentro do arquivo, o feedback da Duda
  function ctBanco() {
    var pastas = ct.pastas || [], all = ct.midia || [];
    var m = ct.sel && all.find(function (x) { return x.id === ct.sel; });
    if (m) return ctDetail(m);
    if (ct.pasta) {
      var list = all.filter(function (x) { return x.pasta === ct.pasta; });
      return '<button type="button" class="back" data-ct-pasta="">← Pastas</button><h2 class="ct-title">' + esc(pastaNome(ct.pasta)) + ' <span>' + list.length + '</span></h2>' +
        (list.length ? '<div class="ct-grid">' + list.map(card).join('') + '</div>' : '<div class="empty">Nada nesta pasta ainda. Toque em "+ Enviar fotos e vídeos".</div>');
    }
    // "Antes e depois" leva às fichas dos pacientes (só o Pedro vê)
    var ad = window.painelDono ? '<button type="button" class="tile tile-ad" data-goto="pacientes"><span class="tile-n">' + ((pc.lista || []).length) + '</span>' +
      '<span class="tile-name">Antes e depois · pacientes</span></button>' : '';
    return '<div class="ct-tiles">' + ad + pastas.map(function (p) {
      var items = all.filter(function (x) { return x.pasta === p.id; }), last = items[0];
      return '<button type="button" class="tile" data-ct-pasta="' + esc(p.id) + '">' + (last ? thumb(last, 'tile-bg') : '') +

    }).join('') +
      (ct.newFolder != null ? '<div class="tile new"><input type="text" maxlength="40" data-ct-f="newFolder" value="' + esc(ct.newFolder) + '" placeholder="Nome da pasta"><button type="button" class="btn" data-ct-addyes="1">Criar</button></div>'
        : '<button type="button" class="tile new" data-ct-addfolder="1"><span class="tile-n">+</span><span class="tile-name">Nova pasta</span></button>') + '</div>' +
      (all.length ? '' : '<p class="note">O banco está vazio. Envie as fotos e os vídeos que você gravar; a Duda analisa cada um.</p>');
  }

  // aba Edição: o que está na fila, sendo editado, pronto ou com problema
  function renderEdicao() {
    var head = '<header class="page-head"><span class="eyebrow">Edição</span><h1>Edição</h1>' +
      '<p>Os vídeos que você mandou para o Rafa. Ele edita todo dia às 8h: corte vertical, gancho na tela e assinatura.</p></header>';
    if (!state.db) return head + '<div class="empty">' + (state.loading ? 'Carregando…' : '<b>O banco não carregou.</b>') + '</div>';
    var items = (ct.midia || []).filter(function (m) { return m.edicao; });
    if (ct.msg) head += '<div class="ag-warn">' + esc(ct.msg) + '</div>';
    if (!items.length) return head + '<div class="empty"><b>Nada em edição.</b> Abra um vídeo em Conteúdo e, se a Duda deu verde, toque em "Enviar para edição".</div>';
    return head + ['editando', 'pedida', 'pronta', 'falhou'].map(function (st) {
      var l = items.filter(function (m) { return m.edicao.status === st; }); if (!l.length) return '';
      return '<section class="ed-group"><h2>' + esc(ED_ST[st]) + ' <span>' + l.length + '</span></h2><div class="ed-list">' + l.map(function (m) {
        var e = m.edicao;
        return '<article class="ed-item st-' + st + '"><div class="ed-media">' + (st === 'pronta' && e.asset ? '<video src="' + blobUrl(e.asset) + '" controls playsinline preload="metadata"></video>' : thumb(m, 'pm')) + '</div>' +
          '<div class="ed-info"><h3>' + esc(m.nota || 'Vídeo') + '</h3><p class="hint">' + esc(pastaNome(m.pasta)) + (e.pedido_em ? ' · pedido em ' + esc(fmtDay(e.pedido_em.slice(0, 10))) : '') + '</p>' +
          (e.pedido ? '<p><b>Pedido:</b> ' + esc(e.pedido) + '</p>' : '') +
          (e.feedback && (st === 'pedida' || st === 'editando') ? '<p class="ed-fbpedido"><b>Seu ajuste' + (e.rodada > 1 ? ' (versão ' + e.rodada + ')' : '') + ':</b> ' + esc(e.feedback) + '</p>' : '') +
          (e.notas ? '<p class="hint">' + esc(e.notas) + '</p>' : '') +
          '<div class="acts">' + (st === 'pronta' && e.asset && ct.downloads ? '<button type="button" class="btn primary" data-ct-dl="' + esc(e.asset) + '" data-ct-dlname="' + esc(slug(m.nota || 'video')) + '-editado.mp4">Baixar vídeo</button>' : '') +
          (st === 'pedida' || st === 'falhou' ? '<button type="button" class="btn" data-ct-unedit="' + esc(m.id) + '">Tirar da fila</button>' : '') +
          (st === 'falhou' ? '<button type="button" class="btn" data-ct-retry="' + esc(m.id) + '">Tentar de novo</button>' : '') +

          (st === 'pronta' || st === 'falhou' ? '<div class="ed-fb"><label>O que mudar na edição?<textarea rows="3" maxlength="1500" data-ct-fbtxt="' + esc(m.id) + '" placeholder="Ex.: o texto do gancho cobriu meu rosto; corta a parte em que eu gaguejo, perto dos 12 segundos">' + esc(ct.fbTxt[m.id] || '') + '</textarea></label>' +
            '<div class="acts"><button type="button" class="btn primary" data-ct-refazer="' + esc(m.id) + '">Pedir para o Rafa refazer</button>' +

  function ctPost(p) {
    var midias = (p.midia || []).map(function (id) { return (ct.midia || []).find(function (m) { return m.id === id; }); }).filter(Boolean);

  function ctCrono() {
    var today = todayIso(), posts = (ct.posts || []).slice().sort(function (a, b) { return (a.data + (a.hora || '')).localeCompare(b.data + (b.hora || '')); });
    var next = posts.filter(function (p) { return p.data >= today && p.estado !== 'descartado'; });
    var old = posts.filter(function (p) { return !(p.data >= today && p.estado !== 'descartado'); }).reverse();
    if (!posts.length) return '<div class="empty"><b>Ainda não há cronograma.</b> Quando houver fotos e vídeos no banco, a Duda monta os próximos posts com legenda, e o Rafa edita os vídeos. Ela roda todo dia às 7h.</div>';
    return '<div class="posts">' + (next.length ? next.map(ctPost).join('') : '<div class="empty">Nenhum post marcado daqui para a frente.</div>') + '</div>' +
      (old.length ? '<button type="button" class="link-btn" data-ct-old="1">' + (ct.showOld ? 'Esconder' : 'Ver') + ' os anteriores e descartados (' + old.length + ')</button>' +

  }

    for (var i = 0; i < 7; i++) { var x = new Date(seg.getFullYear(), seg.getMonth(), seg.getDate() + i); dias.push(isoOf(x)); }

    else delete f[n];
    ct.desafios = { inicio: cur.inicio || todayIso(), feitos: f };   // mostra já; o banco confirma em seguida

  // foto: redesenha em JPEG (no máx. 2560 px), o que também tira a localização do GPS
  function prepImage(file) {
    return createImageBitmap(file, { imageOrientation: 'from-image' }).then(function (bmp) {
      var s = Math.min(1, 2560 / Math.max(bmp.width, bmp.height)), c = document.createElement('canvas');
      c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
      c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
      return new Promise(function (ok) { c.toBlob(ok, 'image/jpeg', 0.88); });
    });
  }

    var ca = (pc.cmp.antes && a.find(function (f) { return f.asset === pc.cmp.antes; })) || a[0];
    var cd = (pc.cmp.depois && d.find(function (f) { return f.asset === pc.cmp.depois; })) || d[d.length - 1];
    var foto = pc.foto && (p.fotos || []).find(function (f) { return f.asset === pc.foto; });
    var cab = '<button type="button" class="back" data-pc-voltar="1">← Pacientes</button>' +
      (pc.editNome != null ? '<div class="pc-nomeedit"><input type="text" maxlength="80" data-pc-f="editNome" value="' + esc(pc.editNome) + '"><button type="button" class="btn primary" data-pc-nomeok="1">Salvar</button><button type="button" class="btn" data-pc-nomeno="1">Cancelar</button></div>'
        : '<h2 class="ct-title">' + esc(p.nome) + ' <button type="button" class="link-btn" data-pc-nome="1">editar nome</button></h2>');
    if (foto) return cab + '<div class="pc-ver"><img src="' + blobUrl(foto.asset) + '" alt="">' +
      '<div class="acts"><span class="hint">' + esc(fmtDay(foto.data || '')) + '</span>' +
      '<div class="seg" role="group" aria-label="Fase"><button type="button" data-pc-fase="antes" aria-pressed="' + (foto.fase === 'antes') + '">Antes</button><button type="button" data-pc-fase="depois" aria-pressed="' + (foto.fase === 'depois') + '">Depois</button></div>' +
      (pc.confirmDel === 'foto' ? '<span class="hint bad">Apagar esta foto de vez?</span><button type="button" class="btn" data-pc-fotodelok="1">Sim, apagar</button><button type="button" class="btn" data-pc-delno="1">Não</button>'
        : '<button type="button" class="btn" data-pc-fotodel="1">Apagar foto</button>') +
      '<button type="button" class="btn" data-pc-fotofecha="1">Fechar</button></div></div>';
    return cab +
      (pc.msg ? '<div class="ag-warn">' + esc(pc.msg) + '</div>' : '') + pcUploadForm(p) +
      (a.length || d.length ? '<div class="pc-cmp">' +
        '<figure><figcaption>Antes' + (ca ? ' · ' + esc(fmtDay(ca.data || '')) : '') + '</figcaption>' + (ca ? '<img src="' + blobUrl(ca.asset) + '" alt="Antes">' : '<div class="pc-vazio">Sem foto de antes</div>') + '</figure>' +
        '<figure><figcaption>Depois' + (cd ? ' · ' + esc(fmtDay(cd.data || '')) : '') + '</figcaption>' + (cd ? '<img src="' + blobUrl(cd.asset) + '" alt="Depois">' : '<div class="pc-vazio">Sem foto de depois</div>') + '</figure></div>' : '') +
      (pc.up ? '' : '<div class="acts"><button type="button" class="btn primary" data-pc-up="1">+ Adicionar fotos</button></div>') +
      ['antes', 'depois'].map(function (fase) {
        var l = fase === 'antes' ? a : d, sel = fase === 'antes' ? ca : cd;
        return '<section class="pc-fase"><h3>' + (fase === 'antes' ? 'Antes' : 'Depois') + ' <span>' + l.length + '</span></h3>' +
          (l.length ? '<div class="pc-ths">' + l.map(function (f) { return pcFoto(f, sel && sel.asset === f.asset ? ' on' : ''); }).join('') + '</div>' +
            '<p class="hint">Toque numa foto para pôr na comparação; toque de novo para abrir, trocar de lado ou apagar.</p>' : '<p class="hint">Nenhuma.</p>') + '</section>';
      }).join('') +
      pcRetFicha(p) +
      '<section class="pc-dados"><h3>Ficha</h3>' +
      '<label>Telefone (WhatsApp)<input type="tel" maxlength="20" data-pc-f="tel" value="' + esc(p.telefone || '') + '" placeholder="(41) 99999-9999"></label>' +
      '<label class="pc-check"><input type="checkbox" data-pc-div="1"' + (p.divulgacao === 'sim' ? ' checked' : '') + '> Assinou a autorização de uso de imagem (TCLE) para divulgação</label>' +
      '<p class="hint">' + (p.divulgacao === 'sim' ? 'Pode virar post, mas só se você mesmo levar a foto para o Conteúdo.' : 'Sem autorização: estas fotos não podem ir para post.') + ' A Duda e o Rafa não veem esta aba.</p>' +
      '<label>Observações<textarea rows="3" maxlength="2000" data-pc-f="obs" placeholder="Ex.: facetas em resina 13 a 23">' + esc(p.obs || '') + '</textarea></label>' +
      '<div class="acts"><button type="button" class="btn" data-pc-obs="1">Salvar telefone e observações</button>' +
      (pc.confirmDel === 'pac' ? '<span class="hint bad">Apagar o paciente e todas as fotos?</span><button type="button" class="btn" data-pc-pacdelok="1">Sim, apagar tudo</button><button type="button" class="btn" data-pc-delno="1">Não</button>'
        : '<button type="button" class="btn" data-pc-pacdel="1">Apagar paciente</button>') + '</div></section>';
  }

  function renderPacientes() {
    var head = '<header class="page-head"><span class="eyebrow">Pacientes</span><h1>Pacientes</h1>' +
      '<p>A ficha de cada paciente com as fotos do sorriso, de antes e de depois. Só você vê esta aba.</p></header>';
    if (!window.painelDono) return head + '<div class="empty"><b>Só o Pedro vê os pacientes.</b> Por sigilo e LGPD, esta aba não abre para outras contas.</div>';
    if (!state.db || pc.lista == null) return head + '<div class="empty">Carregando…</div>';
    var p = pcAtual();
    if (p) return head + pcFicha(p);
    return head + pcRetPainel() + '<div class="ag-bar"><input type="search" class="pc-busca" placeholder="Buscar paciente pelo nome" data-pc-busca="1" value="' + esc(pc.busca) + '" autocomplete="off">' +
      '<button type="button" class="btn primary" data-pc-novo="1">+ Novo paciente</button></div>' +
      (pc.novo != null ? '<div class="ag-form"><h2>Novo paciente</h2><label>Nome<input type="text" maxlength="80" data-pc-f="novo" value="' + esc(pc.novo) + '" placeholder="Nome do paciente"></label>' +
        '<div class="acts"><button type="button" class="btn primary" data-pc-criar="1">Criar ficha</button><button type="button" class="btn" data-pc-novocancel="1">Cancelar</button></div></div>' : '') +
      (pc.msg ? '<div class="ag-warn">' + esc(pc.msg) + '</div>' : '') +
      '<div id="pc-lista">' + pcLista() + '</div>';
  }

  function pcSalvar(p, patch, erroMsg) {
    return state.db.doc('pacientes/' + p.id).update(patch).catch(function () { pc.msg = erroMsg || 'Não salvou. Tente de novo.'; render(); });
  }

  function pcSend() {
    var p = pcAtual(), u = pc.up; if (!p || !u) return;
    if (!u.files || !u.files.length) { u.err = 'Escolha as fotos.'; render(); return; }
    var files = Array.prototype.slice.call(u.files), novas = [], fails = 0;
    pc.prog = 'Lendo as datas das fotos…'; render();
    Promise.all(files.map(dataDaFoto)).then(function (datas) {
      // automático: as fotos do dia mais antigo são o antes; se todas forem do mesmo dia, comparam-se com as que o paciente já tem
      var menor = datas.slice().sort()[0], todasIguais = datas.every(function (d) { return d === menor; });
      var jaAntes = fotosDe(p, 'antes')[0];
      function fase(d) {
        if (u.fase !== 'auto') return u.fase;
        if (todasIguais) return jaAntes && jaAntes.data < d ? 'depois' : 'antes';
        return d === menor ? 'antes' : 'depois';
      }
      function next(i) {
        if (i >= files.length) {
          var ok = function () { pc.prog = null; pc.up = null; pc.cmp = { antes: null, depois: null };
            pc.msg = novas.length + (novas.length === 1 ? ' foto enviada' : ' fotos enviadas') + (fails ? '; ' + fails + ' não foram (formato não aceito ou falha na rede)' : '') + '.'; render(); };
          if (!novas.length) { ok(); return; }
          state.db.doc('pacientes/' + p.id).get().then(function (s) {
            var atuais = (s.exists && s.data().fotos) || [];
            return state.db.doc('pacientes/' + p.id).update({ fotos: atuais.concat(novas) });
          }).then(ok, function () { pc.prog = null; pc.msg = 'As fotos subiram, mas a ficha não salvou. Tente de novo.'; render(); });
          return;
        }
        pc.prog = 'Enviando ' + (i + 1) + ' de ' + files.length + '…'; render();
        prepImage(files[i]).then(function (b) { return ct.assets.upload(b, { type: 'image/jpeg', bucket: 'pacientes' }); }).then(function (r) {
          novas.push({ asset: r.id, fase: fase(datas[i]), data: datas[i], enviado: new Date().toISOString() });
        }, function () { fails++; }).then(function () { next(i + 1); });
      }
      next(0);
    });
  }

  function pcClick(t) {
    var a, p = pcAtual();
    if (t.closest('[data-pc-novo]')) { pc.novo = ''; pc.msg = null; render(); return; }
    if (t.closest('[data-pc-novocancel]')) { pc.novo = null; render(); return; }
    if (t.closest('[data-pc-criar]')) {
      var nome = (pc.novo || '').trim(); if (!nome) return;
      var id = pcId();
      state.db.doc('pacientes/' + id).set({ nome: nome, busca: semAcento(nome), criado: new Date().toISOString(), divulgacao: 'nao', obs: '', fotos: [] })
        .then(function () { pc.novo = null; pc.sel = id; pc.up = { fase: 'auto', files: null }; }, function () { pc.msg = 'A ficha não foi criada. Tente de novo.'; }).then(render);
      return;
    }
    if ((a = t.closest('[data-pc-sel]'))) { pc.sel = a.getAttribute('data-pc-sel'); pc.foto = null; pc.up = null; pc.msg = null; pc.confirmDel = false; pc.cmp = { antes: null, depois: null }; pc.ret = { motivo: '', data: '' }; pc.verFeitos = false; render(); window.scrollTo(0, 0); return; }
    if (t.closest('[data-pc-voltar]')) { pc.sel = null; pc.foto = null; pc.up = null; pc.msg = null; pc.editNome = null; render(); return; }
    // retorno feito: funciona na lista geral e na ficha
    if ((a = t.closest('[data-pc-retok]'))) {
      var par = a.getAttribute('data-pc-retok').split('|'), pr = (pc.lista || []).find(function (x) { return x.id === par[0]; }); if (!pr) return;
      a.disabled = true;
      pcSalvar(pr, { retornos: (pr.retornos || []).map(function (r) { return r.id === par[1] ? Object.assign({}, r, { feito: new Date().toISOString() }) : r; }) });
      return;
    }
    if (!p) return;
    if ((a = t.closest('[data-pc-retmes]'))) { pc.ret.data = maisMeses(+a.getAttribute('data-pc-retmes')); render(); return; }
    if (t.closest('[data-pc-retfeitos]')) { pc.verFeitos = !pc.verFeitos; render(); return; }
    if (t.closest('[data-pc-retadd]')) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(pc.ret.data)) { pc.msg = 'Escolha a data do retorno.'; render(); return; }
      var novo = { id: pcId(), data: pc.ret.data, motivo: (pc.ret.motivo || '').trim() || 'Retorno', feito: null };
      pc.msg = null;
      pcSalvar(p, { retornos: (p.retornos || []).concat([novo]) }, 'O retorno não foi salvo. Tente de novo.').then(function () { if (!pc.msg) { pc.ret = { motivo: '', data: '' }; render(); } });
      return;
    }
    if ((a = t.closest('[data-pc-retdel]'))) {
      var rid = a.getAttribute('data-pc-retdel');
      pcSalvar(p, { retornos: (p.retornos || []).filter(function (r) { return r.id !== rid; }) });
      return;
    }
    if (t.closest('[data-pc-up]')) { pc.up = { fase: 'auto', files: null }; pc.msg = null; render(); return; }
    if (t.closest('[data-pc-upcancel]')) { pc.up = null; render(); return; }
    if (t.closest('[data-pc-send]')) { pcSend(); return; }
    if ((a = t.closest('[data-pc-foto]'))) {
      var as = a.getAttribute('data-pc-foto'), f = (p.fotos || []).find(function (x) { return x.asset === as; }); if (!f) return;
      if (pc.cmp[f.fase] === as || (!pc.cmp[f.fase] && a.classList.contains('on'))) pc.foto = as; else pc.cmp[f.fase] = as;
      pc.confirmDel = false; render(); return;
    }
    if (t.closest('[data-pc-fotofecha]')) { pc.foto = null; pc.confirmDel = false; render(); return; }
    if ((a = t.closest('[data-pc-fase]'))) {
      var nf = a.getAttribute('data-pc-fase');
      pcSalvar(p, { fotos: (p.fotos || []).map(function (x) { return x.asset === pc.foto ? Object.assign({}, x, { fase: nf }) : x; }) });
      pc.cmp = { antes: null, depois: null }; return;
    }
    if (t.closest('[data-pc-fotodel]')) { pc.confirmDel = 'foto'; render(); return; }
    if (t.closest('[data-pc-pacdel]')) { pc.confirmDel = 'pac'; render(); return; }
    if (t.closest('[data-pc-delno]')) { pc.confirmDel = false; render(); return; }
    if (t.closest('[data-pc-fotodelok]')) {
      var alvo = pc.foto;
      ct.assets.delete(alvo, { bucket: 'pacientes' }).then(function () {
        return state.db.doc('pacientes/' + p.id).update({ fotos: (p.fotos || []).filter(function (x) { return x.asset !== alvo; }) });
      }).then(function () { pc.foto = null; pc.confirmDel = false; pc.cmp = { antes: null, depois: null }; }, function () { pc.msg = 'Não deu para apagar agora.'; pc.foto = null; }).then(render);
      return;
    }
    if (t.closest('[data-pc-pacdelok]')) {
      Promise.all((p.fotos || []).map(function (x) { return ct.assets.delete(x.asset, { bucket: 'pacientes' }).catch(function () {}); }))
        .then(function () { return state.db.doc('pacientes/' + p.id).delete(); })
        .then(function () { pc.sel = null; pc.confirmDel = false; pc.msg = 'Paciente apagado.'; }, function () { pc.msg = 'Não deu para apagar agora.'; }).then(render);
      return;
    }
    if (t.closest('[data-pc-nome]')) { pc.editNome = p.nome; render(); return; }
    if (t.closest('[data-pc-nomeno]')) { pc.editNome = null; render(); return; }
    if (t.closest('[data-pc-nomeok]')) {
      var nn = (pc.editNome || '').trim(); if (!nn) return;
      pcSalvar(p, { nome: nn, busca: semAcento(nn) }); pc.editNome = null; return;
    }
    if ((a = t.closest('[data-pc-obs]'))) {
      var tx = main.querySelector('[data-pc-f="obs"]'), tel = main.querySelector('[data-pc-f="tel"]');
      pcSalvar(p, { obs: tx ? tx.value : '', telefone: tel ? tel.value.trim() : (p.telefone || '') }).then(function () { a.textContent = 'Salvo ✓'; });
      return;
    }
  }

  function renderSoon(s) {
    return '<header class="page-head soon-page"><span class="eyebrow">' + esc(s.label) + '</span><h1>Em breve</h1><p>' + esc(s.soon) + '</p></header>';
  }

  function render() {
    renderNav();
    if (state.section === 'agenda') main.innerHTML = renderAgenda();
    else if (state.section === 'conteudo') main.innerHTML = renderConteudo();
    else if (state.section === 'edicao') main.innerHTML = renderEdicao();
    else if (state.section === 'pacientes') main.innerHTML = renderPacientes();
    else if (state.section === 'agentes') main.innerHTML = state.agent === 'marketing' ? renderMarketing() : state.agent === 'lisa' ? renderLisa() : state.agent ? renderArriving(AGENTS.find(function (a) { return a.id === state.agent; })) : renderAgentes();
    else main.innerHTML = renderSoon(SECTIONS.find(function (s) { return s.id === state.section; }));
  }

  nav.addEventListener('click', function (e) {
    var b = e.target.closest('[data-sec]'); if (!b) return;
    state.section = b.getAttribute('data-sec'); state.agent = null;
    try { localStorage.setItem('painel:aba', state.section); } catch (err) {}
    if (state.section === 'agenda') agWatch();
    if (state.section === 'conteudo') ctEnter();
    render(); main.focus && window.scrollTo(0, 0);
  });

  main.addEventListener('click', function (e) {
    var t;
    if (state.section === 'agenda') { agClick(e.target); return; }
    if (state.section === 'conteudo' || state.section === 'edicao') { ctClick(e.target); return; }
    if (state.section === 'pacientes') { pcClick(e.target); return; }
    if (state.agent === 'lisa' && state.db && dmClick(e.target)) return;
    if ((t = e.target.closest('[data-abertas]'))) { var ab = t.getAttribute('data-abertas'); state.abertas[ab] = !state.abertas[ab]; render(); return; }
    if ((t = e.target.closest('[data-ir]'))) { irPara(t.getAttribute('data-ir')); return; }
    if ((t = e.target.closest('[data-setor]'))) {
      var col = document.getElementById('setor-' + t.getAttribute('data-setor'));
      if (col) { document.querySelectorAll('.st-col.marcado').forEach(function (x) { x.classList.remove('marcado'); }); col.classList.add('marcado'); col.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
      return;
    }
    if ((t = e.target.closest('[data-agent]'))) { state.agent = t.getAttribute('data-agent'); render(); window.scrollTo(0, 0); return; }
    if ((t = e.target.closest('[data-back]'))) { state.agent = null; render(); return; }
    if ((t = e.target.closest('[data-day-pick]'))) { state.selected = t.getAttribute('data-day-pick'); render(); return; }
    if ((t = e.target.closest('[data-mark]'))) { mark(t.getAttribute('data-day'), t.getAttribute('data-opt'), t.getAttribute('data-mark')); }
  });

  // campos do formulário da agenda: guardam no estado sem redesenhar (senão o cursor sai do campo)
  main.addEventListener('input', function (e) {
    var k = e.target.getAttribute && e.target.getAttribute('data-ag-f');
    if (k && ag.form) ag.form[k] = e.target.value;
    var c = e.target.getAttribute && e.target.getAttribute('data-ag-c');
    if (c != null && ag.editCats) ag.editCats[+c].nome = e.target.value;
    // feedback da edição: guarda o texto, senão um redesenho (banco atualizando) apaga o que foi digitado
    var fb = e.target.getAttribute && e.target.getAttribute('data-ct-fbtxt');
    if (fb) ct.fbTxt[fb] = e.target.value;
    var dmf = e.target.getAttribute && e.target.getAttribute('data-dm-f');
    if (dmf === 'txt') ct.dmTxt = e.target.value;
    if (dmf === 'tipo') ct.dmTipo = e.target.value;
    var cf = e.target.getAttribute && e.target.getAttribute('data-ct-f');
    if (cf === 'newFolder') ct.newFolder = e.target.value;
    else if (cf && ct.up) ct.up[cf] = e.target.value;
    // pacientes: a busca filtra só a lista, sem redesenhar o campo
    if (e.target.hasAttribute && e.target.hasAttribute('data-pc-busca')) {
      pc.busca = e.target.value;
      var box = document.getElementById('pc-lista'); if (box) box.innerHTML = pcLista();
    }
    var pf = e.target.getAttribute && e.target.getAttribute('data-pc-f');
    if (pf === 'novo') pc.novo = e.target.value;
    else if (pf === 'editNome') pc.editNome = e.target.value;
    else if (pf === 'retMotivo') pc.ret.motivo = e.target.value;
    else if (pf === 'retData') pc.ret.data = e.target.value;
  });
  // conteúdo: arquivos escolhidos e mudanças de pasta / paciente de um arquivo
  main.addEventListener('change', function (e) {
    var el = e.target, id;
    if (el.hasAttribute('data-ct-file') && ct.up) { ct.up.files = el.files; return; }
    if (el.hasAttribute('data-pc-file') && pc.up) { pc.up.files = el.files; pc.up.err = null; return; }
    if (el.getAttribute('data-pc-f') === 'fase' && pc.up) { pc.up.fase = el.value; return; }
    if (el.getAttribute('data-pc-f') === 'retData') { pc.ret.data = el.value; return; }
    if (el.hasAttribute('data-pc-div')) { var pd = pcAtual(); if (pd) pcSalvar(pd, { divulgacao: el.checked ? 'sim' : 'nao' }); return; }
    if ((id = el.getAttribute('data-ct-move'))) state.db.doc('midia/' + id).update({ pasta: el.value }).catch(function () { ct.msg = 'Não mudou de pasta.'; render(); });
    if ((id = el.getAttribute('data-ct-pac'))) state.db.doc('midia/' + id).update({ paciente: el.value }).catch(function () { ct.msg = 'Não salvou.'; render(); });
  });

  function mark(dayId, optId, value) {
    if (!state.db) return;
    var day = state.days.find(function (d) { return d.id === dayId; }); if (!day) return;
    var cur = (day.estado || {})[optId];
    var next = cur === value ? '' : value;
    var key = dayId + ':' + optId;
    state.saving[key] = true; render();
    var patch = {}; patch[optId] = next || { __delete__: true };
    var write = next ? state.db.doc('marketing/' + dayId).update({ estado: patch })
      : state.db.doc('marketing/' + dayId).get().then(function (snap) {
          var est = Object.assign({}, (snap.data() || {}).estado || {}); delete est[optId];
          var body = Object.assign({}, snap.data() || {}); body.estado = est;
          return state.db.doc('marketing/' + dayId).set(body);
        });
    write.catch(function (err) {
      state.error = err && err.code === 'invalid_argument' ? 'Só o dono do painel pode marcar opções.' : 'A marcação não foi salva. Tente de novo.';
    }).then(function () { delete state.saving[key]; render(); });
  }

  render();

  if (window.claude && window.claude.use) {
    window.claude.use('db').then(function (db) {
      if (!db) { state.loading = false; render(); return; }
      state.db = db;
      db.doc('config/agenda').onSnapshot(function (snap) {
        ag.cats = ((snap.exists ? snap.data() : null) || {}).categorias || [];
        if (state.section === 'agenda') render();
      }, function () { ag.cats = []; });
      function ctSub(q, key) {
        q.onSnapshot(function (snap) {
          ct[key] = snap.docs.map(function (d) { var x = Object.assign({}, d.data()); x.id = d.id; return x; });
          if (state.section === 'conteudo' || state.section === 'edicao' || state.section === 'agentes') render();
        }, function () { ct[key] = ct[key] || []; });
      }
      db.doc('config/conteudo').onSnapshot(function (snap) {
        ct.pastas = ((snap.exists ? snap.data() : null) || {}).pastas || [];
        if (state.section === 'conteudo') render();
      }, function () { ct.pastas = []; });
      db.doc('config/desafios').onSnapshot(function (snap) {
        ct.desafios = (snap.exists ? snap.data() : null) || {};
        if (state.section === 'conteudo' || state.section === 'agentes') render();
      }, function () { ct.desafios = ct.desafios || {}; });
      ctSub(db.collection('midia').orderBy('criado', 'desc').limit(500), 'midia');
      ctSub(db.collection('cronograma').orderBy('data', 'desc').limit(200), 'posts');
      ctSub(db.collection('agentes').limit(50), 'agentes');
      // Lisa (09/11/2026): relatórios do Instagram e respostas de DM
      ctSub(db.collection('instagram').orderBy('data', 'desc').limit(30), 'insta');
      ctSub(db.collection('dm').orderBy('criado', 'desc').limit(100), 'dm');
      // pacientes: só para o dono (o banco também recusa os outros)
      if (window.painelDono) db.collection('pacientes').limit(1000).onSnapshot(function (snap) {
        pc.lista = snap.docs.map(function (d) { var x = Object.assign({}, d.data()); x.id = d.id; return x; });
        if (state.section === 'pacientes' || (state.section === 'conteudo' && !ct.pasta && !ct.sel)) render(); else renderNav();   // o número de retornos aparece no menu
      }, function () { pc.lista = pc.lista || []; render(); });
      var timer = setTimeout(function () { state.slow = true; render(); }, 10000);
      db.collection('marketing').orderBy('data', 'desc').limit(30).onSnapshot(function (snap) {
        state.days = snap.docs.map(function (d) { var x = Object.assign({}, d.data()); x.id = d.id; return x; });
        if (!snap.metadata.fromCache) { clearTimeout(timer); state.loading = false; state.slow = false; }
        else if (state.days.length) state.loading = false;
        render();
      }, function (err) {
        clearTimeout(timer); state.loading = false;
        state.error = err && err.code === 'revoked' ? 'O acesso a este painel mudou.' : 'Tente abrir de novo daqui a pouco.';
        render();
      });
    }, function () { state.loading = false; render(); });
  } else {
    state.loading = false; render();
  }

  // Google Agenda: só liga a aba quando o claude.ai entrega o mcp; sem ele, a aba explica o porquê
  if (window.claude && window.claude.use) {
    window.claude.use('mcp').then(function (m) { ag.mcp = m; ag.ready = true; if (state.section === 'agenda') agWatch(); render(); },
      function () { ag.ready = true; render(); });
  } else ag.ready = true;

  // Conteúdo: enviar arquivos (só quem edita o painel) e baixar o vídeo editado
  if (window.claude && window.claude.use) {
    Promise.all([window.claude.use('assets'), window.claude.use('downloads')]).then(function (r) {
      ct.assets = r[0]; ct.downloads = r[1]; ct.ready = true;
      if (state.section === 'conteudo') { ctEnter(); render(); }
    }, function () { ct.ready = true; render(); });
  } else ct.ready = true;

})();
</script>


</body>
</html>
