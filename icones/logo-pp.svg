    <rect x="499.5" y="380" width="3" height="308"/>
    <rect x="520.5" y="384" width="3" height="303"/>
    <rect x="545.5" y="520" width="3" height="167"/>
    <!-- travessas entre as hastes -->
    <rect x="501" y="517.5" width="47" height="4"/>
    <rect x="501" y="600" width="47" height="3.5"/>
  </g>
  <g stroke="#7a1f2b" stroke-width="3" stroke-linecap="round">
    <path d="M583 522C572 524 566.5 531 566.5 540L568.5 687"/>
